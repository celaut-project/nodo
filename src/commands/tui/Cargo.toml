[package]
name = "tui"
version = "0.1.0"
authors = ["jse07 <jse07@anon.erg>"]
license = "MIT"
edition = "2021"

[dependencies]
crossterm = { version = "0.27.0", features = ["event-stream"] }
futures = "0.3.30"
ratatui = "0.26.0"
tokio = { version = "1.35.1", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
sysinfo = "0.30.7"
regex = "1.10.5"
prost = "0.11"
prost-derive = "0.11"
prost-types = "0.11"
serde_json = "1"
serde_yaml = "0.9"
# Collapsible tree view for the Config page (issue #248). 0.20.0 is the newest
# release built on ratatui ^0.26, matching the pinned ratatui above.
tui-tree-widget = "0.20.0"
# Re-derives each instance's tap interface name (sha1 of the instance id) the same
# way the CH virtualizer programmed it, so the live network counters need no new
# catalogue column. Not a security use — but hand-rolling the digest would risk
# silently producing a wrong name, which reads as "no traffic".
sha1 = "0.10"

[build-dependencies]
prost-build = "0.11"
# Vendored protoc so the build doesn't require a system-installed protobuf compiler.
protoc-bin-vendored = "3"
