main:
  MAIN_DIR: "/nodo"
  STORAGE: "/nodo/storage"
  CACHE: "${main.STORAGE}/__cache__/"
  REGISTRY: "${main.STORAGE}/__registry__/"
  METADATA_REGISTRY: "${main.STORAGE}/__metadata__/"
  BLOCKDIR: "${main.STORAGE}/__block__/"
  DATABASE_FILE: "${main.STORAGE}/database.sqlite"

dependencies:
  java:
    RUNTIME_ROOT: "${main.MAIN_DIR}/runtime/java"
    JAVA_HOME: "${main.MAIN_DIR}/runtime/java/current"
  python:
    RUNTIME_BIN: "${main.MAIN_DIR}/runtime/python/current/bin/python3"
    VENV_BIN: "${main.MAIN_DIR}/venv/bin/python"
    RUNTIME_ROOT: "${main.MAIN_DIR}/runtime/python"
  yq:
    BIN: "${main.MAIN_DIR}/bin/yq"
  # BuildKit is an OPTIONAL, node-local dependency used only by the local packer
  # (packer.local: true). It is NOT installed at node-install time; nodo runs
  # bash/install_buildkit.sh on demand (like install_java.sh) and drives its own
  # ROOTLESS builder under MAIN_DIR — never a system-wide daemon. The builder runs
  # as the invoking user, which is why `nodo pack` needs no sudo at all. These
  # paths are the portable defaults; override only to relocate the toolchain.
  buildkit:
    BIN: "${main.MAIN_DIR}/bin/buildctl"
    DAEMON_BIN: "${main.MAIN_DIR}/bin/buildkitd"
    BUILDKIT_SOCKET: "${main.MAIN_DIR}/buildkit/buildkitd.sock"

virtualizers:
  # Cloud Hypervisor is the only virtualizer. The Docker virtualizer was removed
  # so the node no longer needs a local Docker install.
  DEFAULT_VIRTUALIZER: ch
  ch:
    BINARY_PATH: ""
    # Guest kernel/initramfs per architecture. The installer provisions BOTH
    # arches from the pinned guest-kernel release, not just the host's: the
    # foreign one is what QEMU boots under emulation (see virtualizers.qemu), and
    # an arch whose assets are missing from disk is simply never advertised.
    KERNEL_PATHS:
      linux/amd64: "${main.MAIN_DIR}/cloud_hypervisor/kernels/linux/amd64/vmlinuz"
      linux/arm64: "${main.MAIN_DIR}/cloud_hypervisor/kernels/linux/arm64/vmlinuz"
    INITRAMFS_PATHS:
      linux/amd64: "${main.MAIN_DIR}/cloud_hypervisor/initramfs/linux/amd64/initramfs"
      linux/arm64: "${main.MAIN_DIR}/cloud_hypervisor/initramfs/linux/arm64/initramfs"
    CACHE_DIR: "${main.CACHE}/ch"
    # Keep this path short to avoid Unix socket SUN_LEN limits.
    API_SOCKET_DIR: "/tmp/nodo-ch"
    # virtiofsd daemon for shared filesystems (parent -> child inheritance).
    # Only invoked for services that declare shared/guest directories.
    VIRTIOFSD_BINARY: "virtiofsd"
    NETWORK_MODE: "tap_bridge"
    NETWORK_BRIDGE_NAME: "nodo-br-ch"
    NETWORK_SUBNET: "192.168.200.0/24"
    NETWORK_GATEWAY_IP: "192.168.200.1"
    # Whether nodo may write into the iptables compatibility table when something
    # else on this host filters the forward hook. nodo accepts guest traffic in its
    # own nftables table at priority -5, which does not survive a later DROP: with
    # Docker installed (FORWARD policy DROP) or ufw's default forward policy, a
    # parent cannot reach the child it just launched.
    #
    #   auto  (default) add nodo's own NODO_FWD chain only when the live ruleset
    #         shows something on the forward hook that would drop this traffic
    #   on    always add it, for a host whose ruleset cannot be read
    #   off   never write outside nodo's own tables
    #
    # Inspect or undo it with 'nodo firewall-compat status|apply|remove'. It cannot
    # reach a firewall with a native nftables table of its own -- firewalld, which
    # is the default on Fedora and RHEL -- where forwarding has to be allowed for
    # the bridge in firewalld itself.
    FORWARD_COMPAT: "auto"
    # Guest interface used by the kernel ip=... cmdline.
    # Use "auto" to avoid hardcoding (recommended), or set e.g. "eth0".
    GUEST_NET_DEVICE: "auto"
    # Extra kernel cmdline parameters for guest boot diagnostics. Empty by default.
    #
    # Do NOT put console= here. The guest console is architecture-determined and set
    # automatically (ttyAMA0 on arm64, ttyS0 on x86_64); a console= in this field is
    # dropped with a warning. This used to default to "console=ttyS0", which on arm64
    # names a device the guest kernel has no driver for -- /dev/console never opens,
    # /init dies on its first redirection, and every launch ends in
    # "Kernel panic - not syncing: Attempted to kill init!".
    KERNEL_CMDLINE_EXTRA: ""
    # Fail fast if the guest does not become reachable on the bridge network.
    GUEST_NETWORK_READY_TIMEOUT_S: 20
    # Memory policy for VM boot:
    # - MIN_MEM_MIB is only the floor needed to boot lightweight workloads.
    # - Services requiring more memory must request it explicitly in sysresources.
    MIN_MEM_MIB: 128
    DEFAULT_MEM_MIB: 256
    # Guest kernel reserve: how much MORE than a service's declared mem_limit the VM
    # is booted with, so the service really gets what it declared.
    #
    # The guest kernel's own footprint comes out of the VM's RAM before init runs.
    # Booting at exactly mem_limit therefore hands the service LESS than its manifest
    # declared -- a service declaring 256 MiB was OOM-killed at ~228 MiB, below its
    # own published ceiling. This is the memory counterpart of the OVERHEAD_BYTES the
    # rootfs image has always been grown by.
    #
    # The reserve is ARCHITECTURE-DEPENDENT because the overhead is. Measured from the
    # guest kernels' own `Memory: <avail>K/<total>K available` boot line:
    #
    #   linux/arm64   ~22.8 MiB + ~2.2% of the guest
    #   linux/amd64   ~31.4 MiB + ~1.8% of the guest
    #
    # amd64's kernel image, percpu areas and reserved low memory cost ~9 MiB more
    # than arm64's; the proportional part is the `struct page` array (64 bytes per
    # 4 KiB frame) and is near-identical on both.
    #
    # Both defaults carry margin -- overhead also varies with kernel version and
    # config, and the failure mode of too little is a guest OOM -- but not in the
    # same way, because margin on the two parts behaves differently. On MIB it is a
    # constant (~8 MiB, whatever the guest's size), and that is also where
    # kernel-version variance actually lives, so it is generous. On RATIO it is
    # multiplied by the guest, so it is kept near the physics: 1.5625% is the
    # `struct page` floor, the measurements fit at 1.8-2.1%, and 0.025 clears both
    # with headroom. A flat 0.05 would reserve 450 MiB on an 8 GiB guest where the
    # kernel takes ~180 -- host RAM the node commits and cannot bill.
    #
    # THE NODE ABSORBS THIS. It is never billed to the client: an instance is charged
    # for the RAM it declared and can use, never for the kernel underneath it. So it
    # is a real cost to the operator, and `pricing.RAM_MU_PER_GIB_HOUR` (or the
    # per-arch override under `pricing.BY_ARCH`) is what has to cover it. The TUI's
    # pricing page shows the effective per-arch figure -- what the node earns per GiB
    # actually committed, once the reserve is accounted for.
    #
    # Uncomment to override a measurement with your own. MIB and RATIO both at 0
    # restore the pre-reserve behaviour for that architecture alone.
    # GUEST_KERNEL_RESERVE:
    #   linux/amd64:
    #     MIB: 40
    #     RATIO: 0.025
    #   linux/arm64:
    #     MIB: 32
    #     RATIO: 0.025
    # cgroup v2 root path for per-VM lifecycle hotplug controls.
    CGROUPS_BASE_DIR: "/sys/fs/cgroup"
    # Guest output streams for debug:
    # SERIAL_MODE: file|off|null|tty|file=/custom/path.log
    # CONSOLE_MODE: off|null|tty|file=/custom/path.log
    SERIAL_MODE: "file"
    CONSOLE_MODE: "off"
    CONSERVE_RUNTIME_DIR_ON_FAILURE: true
    SECURITY:
      # Enforce rootfs destination confinement for all filesystem paths.
      PATH_CONFINEMENT: true
      # Device nodes policy for filesystem xattrs: deny|allowlist
      DEVICE_NODES_POLICY: "deny"
      # Allowlist entries apply only when DEVICE_NODES_POLICY=allowlist.
      # Example:
      # - path: "/dev/null"
      #   type: "char"   # char|block
      #   major: 1
      #   minor: 3
      #   mode: "0666"   # optional permission mode (setuid/setgid/sticky forbidden)
      DEVICE_NODE_ALLOWLIST: []
      # When true, allowlist device nodes only for trusted service IDs.
      REQUIRE_TRUSTED_SERVICE_FOR_DEVICES: true
      # Explicit list of trusted service hashes allowed to use device node allowlist.
      TRUSTED_SERVICE_IDS: []
      # Reserved hook for future rootfs build sandboxing strategy.
      ROOTFS_BUILD_SANDBOX: "none"
      # When true, if a VM fails to boot or encounters an error, its runtime directory will be preserved for debugging instead of being deleted.

  # QEMU is the cross-architecture execution backend, and it is what makes a node
  # advertise a FOREIGN arch as executable at all. Cloud Hypervisor boots a
  # service as a microVM under KVM, which can only run a guest of the host's OWN
  # architecture; for anything else there is no KVM path, so nodo boots the same
  # rootfs/kernel/initramfs under qemu-system-<arch> with `-accel tcg` (software
  # emulation). Native services always take the CH path above and never regress.
  #
  # TCG is an order of magnitude slower than KVM. That is the trade this node
  # accepts by default: it takes arm64 work on x86_64 (and vice versa) rather
  # than rejecting it. Turn ENABLE off to serve only the host's own arch -- the
  # node then stops advertising the foreign one, and a foreign-arch request gets
  # UnsupportedArchitectureException.
  qemu:
    # Master switch for emulated execution. Even when true, an arch is only
    # advertised (and only launchable) if BOTH the emulator binary and that
    # arch's guest kernel/initramfs are present -- so a node never claims a
    # capability it cannot deliver, and turning this on cannot break an install
    # whose qemu-system-<arch> package is missing.
    ENABLE: true
    # Per-arch qemu-system binary. Leave empty to resolve `qemu-system-x86_64` /
    # `qemu-system-aarch64` from PATH.
    BINARY_PATHS:
      linux/amd64: ""
      linux/arm64: ""
    # Guest kernel/initramfs for the EMULATED arch. Leave empty to reuse the CH
    # assets above (virtualizers.ch.KERNEL_PATHS / INITRAMFS_PATHS), which the
    # installer provisions for every arch, not only the host's. Override only to
    # point QEMU at a different image than CH uses.
    KERNEL_PATHS:
      linux/amd64: ""
      linux/arm64: ""
    INITRAMFS_PATHS:
      linux/amd64: ""
      linux/arm64: ""
    # QEMU -cpu model. "max" exposes the fullest feature set under TCG.
    CPU_MODEL: "max"
    # TCG reaches guest console much slower than KVM; allow more time than the CH
    # readiness timeout before declaring the guest network dead.
    GUEST_NETWORK_READY_TIMEOUT_S: 120

builder:
  WAIT_FOR_CONTAINER: 60
  WAIT_FOR_UNLOCK_MEMORY: 60
  BUILD_CONTAINER_MEMORY_SIZE_FACTOR: 3.1
  TRUST_METADATA_ARCHITECTURE: false

packer:
  # local: choose the packer backend (default false).
  #   false -> `nodo pack` delegates to a packer-service (behaviour documented
  #            below): resolve the packer by its core_services id, falling back to
  #            the PACKER_SERVICE_URL override. No builder is installed here.
  #   true  -> `nodo pack` builds the service LOCALLY with nodo's own rootless
  #            BuildKit toolchain, provisioned on demand via
  #            bash/install_buildkit.sh (node-local, independent of any host
  #            Docker); nodo starts its builder right before a pack and stops it
  #            right after, and only one `nodo pack` runs at a time. The builder
  #            is unprivileged, so packing never asks for sudo. See
  #            dependencies.buildkit.* and packer.buildkit.* below.
  local: false
  # nodo no longer builds services locally *by default*. `nodo pack` sends the
  # project to a packer-service microVM (it runs Docker/buildx inside a sealed VM,
  # so Docker is never installed on this host) and imports the returned
  # `.celaut.bee`. (Set packer.local: true to build locally instead.)
  #
  # PRIMARY: the packer is referenced by its published content hash (service id).
  # That id lives in exactly ONE place — the `packer:` entry in
  # the top-level `core_services` mapping below (the single source of truth; it is not
  # configurable here and has no env var). nodo resolves a *running* instance of
  # that service on this node — the one it launches on demand or that you started
  # with `nodo execute <packer-service id>` — and packs against its ip:port.
  #
  # PACKER_SOURCE_URL: manifest URL nodo downloads the packer service from directly
  # when it needs to acquire it (used *before* the source-application lookup). Leave
  # empty to instead resolve the packer's sources via the source-application core
  # service (the `source-application` entry in `core_services`).
  PACKER_SOURCE_URL: ""
  #
  # OPTIONAL override: the ip:port base URL of a packer-service running
  # out-of-band (somewhere other than as a local instance of the id above).
  # Used only when no packer id is set, or when no running instance of that id
  # can be found. Leave empty to resolve the packer by its core_services id instead.
  PACKER_SERVICE_URL: ""
  # Architectures `nodo pack` will accept / announce.
  ARM_PACKER_SUPPORT: true
  X86_PACKER_SUPPORT: true
  # Local-packer tuning (only used when packer.local: true).
  #
  # Inline/block threshold. A file at or over this size is stored as a
  # content-addressed block under main.BLOCKDIR and referenced by a pointer;
  # a smaller one is inlined into the service's filesystem message.
  #
  # It is the main lever on how much memory a service costs, because only the
  # inlined part is ever held: the build streams a pointer straight to its place
  # in the rootfs. Measured packing and building a real 1.17 GB service image
  # (28,131 files):
  #
  #   threshold   blocks   inline retained   pack peak   pack time   build peak
  #       10 MB       13         876.6 MB           -           -     2720.5 MB
  #      256 kB      476         403.3 MB    2449.0 MB       61 s      856.6 MB
  #       32 kB     3962         121.7 MB     802.4 MB      277 s      293.3 MB
  #
  # (10 MB row: inline/blocks measured, pack peak/time not re-measured under the
  # current code -- the formula below estimates ~5.3 GB, consistent with the
  # trend.) 256 kB looked like a middle ground and is not one: this image has
  # 281 MB spread across the 3,486 files between 32 kB and 256 kB, so raising
  # the threshold that far puts most of it back inline, at ~6x cost each. Time
  # scales with block *count*, memory with the bytes still outside a block --
  # in a Python-shaped image those move in opposite directions across most of
  # the range, so there is no threshold that is cheap on both at once here.
  #
  # The cost of a low threshold is pack time and one file per block in
  # main.BLOCKDIR instead of a handful. Identical files across services share a
  # block, so a low threshold also deduplicates far more. Changing it does not
  # change any service id: an object expands to the same bytes either way.
  MIN_BUFFER_BLOCK_SIZE: 32768
  # RAM to lock during a local build, as a factor of the *inlined* bytes -- the
  # files under packer.MIN_BUFFER_BLOCK_SIZE above, which are the only ones held
  # in memory. Files at or over that threshold are streamed into blocks on disk,
  # so an image dominated by large files packs in far less than its size
  # suggests. The default is measured: peak memory tracks the inlined bytes at
  # ~5.9x.
  PACKER_MEMORY_SIZE_FACTOR: 6.0
  # Bytes added per block. With a low packer.MIN_BUFFER_BLOCK_SIZE almost every
  # file becomes a block and nothing is inlined, so this is the term that
  # decides the reservation. Measured at ~7 kB per block.
  PACKER_MEMORY_PER_BLOCK: 10000
  # Fixed cost on top: the worker interpreter itself, ~30 MB before it packs
  # anything.
  PACKER_MEMORY_OVERHEAD: 40000000
  # Seconds a pack waits for that memory before failing. Without a deadline a
  # busy node leaves the pack waiting indefinitely, and it cannot be told apart
  # from one that is still working.
  WAIT_FOR_UNLOCK_MEMORY: 300
  # Reserved: persist every packed artifact to the registry. Kept for parity.
  SAVE_ALL: false
  buildkit:
    # Name of the Dockerfile inside the project directory.
    DOCKERFILE_NAME: "Dockerfile"

network:
  # The gRPC port guests and peers reach this node on. "auto" means "not assigned
  # yet": the installer, and 'nodo serve', pick a free port from FREE_PORTS_RANGE,
  # open it in nodo's own nftables (or iptables) ruleset and write the number back
  # here. Only those two -- an ordinary nodo command never assigns one, even as root:
  # opening a port is not something that should happen because some unrelated command
  # imported a module. An unprivileged run leaves "auto" untouched.
  #
  # The number is stored before the port is proven reachable, and the protection is
  # elsewhere: the node REFUSES TO SERVE on a port it has proven unreachable (see
  # VERIFY_GATEWAY_REACHABILITY below). Proving it at assignment time was tried and
  # was worse -- nothing can be probed before the guest bridge exists, so a host with
  # firewalld and no bridge yet could never be assigned a port at all, and the only
  # way forward was to pin one by hand, which was the one path with no check on it.
  # Storing it early also keeps it stable: "open TCP 58443" is still true tomorrow.
  #
  # Pinning a port you have opened yourself is supported and does NOT skip the check.
  # The accept rule is re-applied on every start (netfilter rules do not survive a
  # reboot; this file does). Whether peers OUTSIDE this LAN can reach the port is a
  # separate question no check here can answer: run 'nodo nat-guide'.
  GATEWAY_PORT: auto
  # Before serving anything, prove a guest can reach GATEWAY_PORT by connecting to it
  # from a throwaway namespace on the guest bridge -- the bridge is brought up at
  # start for this, rather than on the first instance launch, or there would be
  # nowhere to probe from on a node that has never run anything. A conclusive failure
  # stops the node: an unreachable gateway means every service it accepts is unable
  # to call back into it, which is worse than not starting. An inconclusive probe
  # only warns.
  #
  # A success is remembered in <main.CACHE>/gateway_port_passed, so a restart does not
  # redo it; that record is dropped when the port changes and when the host reboots.
  # Set to false only if this host's networking makes the probe unusable -- 'nodo
  # doctor' still reports it either way.
  VERIFY_GATEWAY_REACHABILITY: true
  LOCAL_NETWORK: "lo"
  # How long (seconds) this node expects to keep its current address -- typically the
  # ISP's DHCP lease for a dynamic public IP. Published (signed) alongside the
  # addresses this node announces, so peers can anticipate the change and re-resolve
  # instead of assuming the address is permanent. 0 disables the estimate; prefer that
  # over guessing, since a wrong expiry makes peers drop a still-valid address.
  ADDRESS_VALIDITY_SECONDS: 0
  # Also announce this node's private/LAN addresses to peers, on top of the public one
  # (network.PUBLIC_IP or the outbound address). Off by default: a LAN address is
  # unreachable noise to a remote peer, costs it a connect timeout per probe, and
  # collides across unrelated nodes (every Docker host has 172.17.0.1). Turn it on for
  # an all-on-one-LAN deployment where peers have no public addresses at all.
  ANNOUNCE_PRIVATE_ADDRESSES: false
  PUBLIC_IP: ""  # Optional public IP or DNS name to advertise for `nodo execute --remote`. Leave empty to auto-detect from the default outbound interface.
  EXTERNAL_INTERFACE: ""  # Optional interface name to use when PUBLIC_IP is empty, e.g. "eth0".
  PUBLIC_TCP_PORT: ""  # Optional external TCP port to advertise for the gateway (GATEWAY_PORT), in case your router forwards a different port than the one this node listens on. Leave empty to advertise GATEWAY_PORT itself.
  PUBLIC_UDP_PORT: ""  # Optional external UDP port to advertise, for when a peer-facing feature that listens on UDP exists. Nothing in nodo does yet -- GATEWAY_PORT is TCP-only (gRPC).
  # If true, child instances launched by internal instances are NOT exposed on the host.
  # If false, child instances will be published and reachable from the internet (subject to host firewall).
  ISOLATE_INTERNAL_CHILDREN: true
  CONSIDER_DEV_AS_INTERNAL: true  # If true, instances with "dev" in their father_id are considered internal regardless of actual network location. Use false in case node is controlled via ssh session for example.
  DISABLE_EXPOSE_OUTSIDE: false  # If true, no instances will be exposed outside regardless of other settings. Use for maximum isolation. Services stay reachable through service tunneling (Gateway.ServiceTunnel / `nodo tunnel`), which needs no port of its own -- see docs/TUNNELING.md.
  FREE_PORTS_RANGE:  # Free ports range to use for exposing services. Ports outside this range will not be used for service exposure. Useful to match router forwarding rules. Can be multiple ranges, e.g.: - START: 10000 \n END: 20000 \n - START: 30000 \n END: 40000
    - START: 50000
      END: 60000
  DEFAULT_EXECUTE_REMOTE: false  # If true, `nodo execute` will default to remote execution. Use for nodes running in environments without reliable public IPs or with strict isolation requirements, e.g. on-premises servers behind NAT or in private cloud VPCs, or WSL2 Windows nodes.
  # If false, this node never asks a peer to run a service for it: the balancer stops
  # polling peers for prices and only ever selects "local", so a service this node
  # cannot run itself fails instead of being delegated. The automatic peer-deposit
  # refill stops too -- a deposit buys execution on that peer and nothing else, so
  # funding one would be ERG spent on a service never requested. `nodo pay`,
  # `nodo increase_peer_deposit` and `nodo force_execution` still work: an operator
  # typing the command is overriding this default on purpose. Peers can still ask THIS
  # node to run services for them -- that direction is client.ACCEPT_NEW_DEPOSITS.
  DELEGATE_EXECUTION: true
  # Service tunneling (Gateway.ServiceTunnel) -- see docs/TUNNELING.md.
  DELEGATION_TUNNEL_POLICY: auto  # When a service is delegated to a peer, how its uri_slot is served to our client. "auto": tunnel only when the peer's advertised address is not reachable from us (a client on the same network keeps talking to the peer directly, with no tunnel overhead). "always": tunnel every delegated instance, no reachability guessing. "never": always hand over the peer's own address (a client on another network will fail to connect).
  TUNNEL_UDP_IDLE_TIMEOUT_S: 30  # A datagram slot has no EOF, so a UDP tunnel closes after this many seconds of silence once the caller stops sending.

# Which communication domains this node is willing to run a service for.
#
# A service declares the domains it wants to reach as Service.Network tags -- a
# DNS name, "pow:bitcoin", "*" for open-internet egress (see docs/NETWORKS.md).
# Two controls already narrowed that ask, and neither of them was yours: the
# ancestor chain intersects a child's request with what its parents declared, and
# the per-VM firewall opens only what got resolved. These two lists are yours.
#
# Both empty (the default) restricts nothing, which is how every node behaved
# before this block existed. Patterns are globs, matched case-insensitively
# against each tag -- glob over the tag and nothing more, so "google.com" does NOT
# match "www.google.com": write "*google.com" when you mean the subdomains too.
#
# The blacklist is checked first and wins over the whitelist. A non-empty
# whitelist has to cover EVERY tag a service declares, because each tag can open
# egress on its own. A service that declares no network is always accepted, and
# `blacklist: ["*"]` refuses every service that declares any -- that is how you
# say "nothing beyond this node".
#
# A rejected client is told which tag, which list and which pattern refused it.
# The policy applies to every service, the core services this node starts for
# itself included (packer, source-application): their egress is egress from this
# node too, so whitelist what they need rather than expecting an exemption.
#
# NOTE the name: `service_networks`, not `networks`. The `network:` block above is
# this node's own ports and addresses; the two would be one letter apart, and a
# typo between them would leave the node with no policy while looking configured.
service_networks:
  blacklist: []
  whitelist: []
  # blacklist:
  #   - "*google.com"
  # whitelist:
  #   - "dns:*"
  #   - "pow:bitcoin"

# Dynamic DNS: keep a hostname pointing at this node's public IP, so peers can
# find it by name when the address changes. Tunneling means only the gateway port
# needs to be reachable -- but it still needs forwarding on the router, which is
# the operator's job. `nodo info` reports whether that looks done.
ddns:
  ENABLED: false
  PROVIDER: desec  # Only "desec" is implemented (update.dedyn.io, dyndns2 protocol).
  DOMAIN: ""  # The hostname to keep updated, e.g. "my-node.dedyn.io".
  TOKEN: ""  # Provider API token. Treat as a secret.
  INTERVAL_SECONDS: 600  # How often the address is republished. The manager also publishes once at startup.
  # Which address gets published: by default none is sent and the provider records
  # the request's source address, which is the only value that is certainly right
  # behind NAT. Set network.PUBLIC_IP to override that.

logs:
  MEMORY_LOGS: false
  DEBUG_MODE: false
  TUNNEL_LOGS: false  # Log every tunnel handshake, relay close and billing tick under "[TUNNEL]". Off by default: it is one line per connection and per billed MiB, which buries the rest of the node log on a busy tunnel. Turn on to debug tunneling.

# What this node charges, in MU (monetary unit) -- the node's own unit of account.
# Full model and worked examples: docs/PRICING.md.
#
# MU has no intrinsic value on its own. What one MU is worth is declared per payment
# system (see ledgers.ergo.payments.MU_PER_NANOERG below), and what you read and type is
# a third setting again (ui.DISPLAY_UNIT). Keeping the three apart is what lets a node
# be paid in something other than ERG, or show you a different unit, without touching a
# single price.
#
# There is no single "price of compute" on purpose. Each resource is priced on its own,
# because a node may be short on memory and awash in disk and has to be able to say so.
# Set a price to 0 to give that resource away.
pricing:
  RAM_MU_PER_GIB_HOUR: 1000000
  CPU_MU_PER_VCPU_HOUR: 4000000
  DISK_MU_PER_GIB_HOUR: 100000
  # Per-architecture memory price, overriding RAM_MU_PER_GIB_HOUR for guests of that
  # architecture. Absent -- as in every config written before this existed -- every
  # arch pays the scalar price above, so nothing has to be migrated.
  #
  # Memory is the one resource whose real cost to this node depends on the guest's
  # architecture: the guest kernel reserve the node absorbs and never bills differs
  # per arch (see virtualizers.ch.GUEST_KERNEL_RESERVE), so one rate cannot cover it
  # correctly on both at once. An emulated guest is also far slower per vCPU, which
  # some operators price for; that judgement belongs to the operator, which is why
  # this is a setting and not a derived number.
  #
  # CPU and disk are deliberately NOT per-arch: the node hands a guest the vCPUs and
  # the image it asked for whatever architecture it is.
  #
  # Keys are canonical arch tags, verbatim -- the same strings the rest of the node
  # names architectures by. Edit these from the TUI's pricing page, which shows the
  # effective rate per arch beside the reserve it has to cover.
  # BY_ARCH:
  #   linux/amd64:
  #     RAM_MU_PER_GIB_HOUR: 1000000
  #   linux/arm64:
  #     RAM_MU_PER_GIB_HOUR: 1400000
  # Tunnelled traffic, counting both directions (see docs/TUNNELING.md).
  NET_MU_PER_GIB: 2000000
  # One-off operations, charged once each. Not scaled by scarcity: they price work done
  # once, not occupancy.
  BUILD_MU: 10000000
  TUNNEL_OPEN_MU: 10000
  MODIFY_RESOURCES_MU: 10000
  # Scarcity surcharge, applied to each resource independently from that resource's own
  # availability: 1x while it is plentiful, up to SCARCITY_MAX_MULTIPLIER once it is
  # exhausted. Set the maximum to 1 to price purely by consumption and ignore load.
  SCARCITY_MAX_MULTIPLIER: 10
  # How fast the surcharge arrives. 1.0 is linear in the missing supply; higher values
  # stay near 1x until the resource is genuinely scarce, then rise sharply.
  SCARCITY_CURVE: 1.0

# What this node gives away.
free_tier:
  # Starting balance credited to every new client, in MU. 0 gives nothing away.
  CREDIT_MU_PER_NEW_CLIENT: 0
  # Charge nothing while EVERY resource sits below this share of its capacity (0.0 to
  # 1.0). 0.0 disables it (always charge); 0.5 means "free while the node is under half
  # load". This is how you run a node that is free until it is actually busy.
  FREE_WHILE_SCARCITY_BELOW: 0.0

# What the operator reads and types. Purely presentational: changing it never changes
# what anybody is charged.
ui:
  # "erg" (default) or "mu". "erg" derives its rate from the ledger, so it stays correct
  # if you change MU_PER_NANOERG.
  #
  # Any other name must be declared under ui.UNITS below. That is the hook for showing,
  # say, a fiat figure -- but note the rate would be a static number nothing refreshes,
  # so it goes stale. It never affects what is charged, only what is printed.
  DISPLAY_UNIT: erg
  # UNITS:
  #   usd:
  #     MU_PER_UNIT: 500000000
  #     SYMBOL: "USD"
  #     DECIMALS: 2

# Deposit sizing. These are shares, not amounts: the node derives the figures from the
# ledger's own floor (an Ergo transaction costs a fee and cannot create an output below
# the minimum box value), so a deposit is never quietly eaten by its own fee.
deposits:
  # Whether the node may pay a peer on its own. With this false the manager never
  # broadcasts a refill: a peer whose deposit runs low simply stays low until an
  # operator runs `nodo pay` or `nodo increase_peer_deposit`, since a command someone
  # typed overrides the default policy. Everything else the manager does for a peer
  # (refreshing its address, keeping it in `nodo peers`) is unaffected, and so is the
  # cold-wallet sweep below -- that moves this node's funds between its own wallets and
  # pays nobody. Delegation keeps working with this off; the peer just has to be funded
  # by hand, which is the point.
  AUTOMATIC_REFILL: true
  # Largest share of a peer deposit that may be lost to the transaction fee. 0.02 caps
  # the fee at 2 % of the deposit. Lower it for cheaper transfers, at the cost of
  # locking up more per peer.
  MAX_FEE_OVERHEAD: 0.02
  # Refill a peer once its remaining balance drops below this share of a full deposit.
  REFILL_BELOW: 0.2
  # How long a new instance is funded for when the client asks for no specific balance.
  # The actual amount is the price of the resources it requested, for this long.
  INITIAL_RUNTIME_HOURS: 1.0

costs:
  SOCIALIZATION_FACTOR: 2
  COST_AVERAGE_VARIATION: 1
  # How much tunnelled traffic accumulates before it is billed. Smaller reacts faster to
  # an empty balance, larger costs less bookkeeping.
  TUNNEL_CHARGE_INTERVAL_KB: 1024
  # Let an instance keep running with a negative balance instead of being stopped.
  ALLOW_DEBT: true

timing:
  GENERAL_WAIT_TIME: 2
  GENERAL_ATTEMPTS: 10
  MANAGER_ITERATION_TIME: 10
  SHORT_INTERVAL_COUNT: 20
  COMMUNICATION_ATTEMPTS: 1
  COMMUNICATION_ATTEMPTS_DELAY: 60
  CLIENT_EXPIRATION_TIME: 1200
  EXTERNAL_COST_TIMEOUT: 10
  START_SERVICE_ON_PEER_TIMEOUT: 120

communication:
  # The most components a Peer.signature_scheme may declare before this node refuses
  # to compare it (node_identity.same_signature_scheme). Comparing two schemes is a
  # search for a one-to-one pairing between their components, which is factorial in a
  # length the *peer* chooses: four components is 24 pairings, five is 120, twelve is
  # 479 million. This node declares four, so five leaves room for a scheme with one
  # more building block. Raise it only alongside a scheme that genuinely needs more.
  MAX_SIGNATURE_SCHEME_COMPONENTS: 5
  SELF_ANNOUNCE_TO_CONNECTING_PEERS: false
  SEND_ONLY_HASHES_ASKING_COST: true
  DENEGATE_COST_REQUEST_IF_DONT_VE_THE_HASH: false

client:
  MIN_SLOTS_OPEN_PER_PEER: 1
  # A client whose balance is at least this many MU has its expiration pushed back
  # when it tops up: a funded client is an active one.
  CLIENT_MIN_BALANCE_MU_TO_RESET_EXPIRATION: 1000
  DEV_CLIENT_POOL_SIZE: 1
  DEV_EXTERNAL_CLIENT_POOL_SIZE: 1
  # If false, no client (local or peer) can open a NEW deposit -- GenerateDepositToken
  # is refused outright. A client that already holds MU keeps spending it normally;
  # this only cuts off acquiring more. Use to stop onboarding new demand (or new
  # top-ups from existing clients) without touching anyone's current balance.
  ACCEPT_NEW_DEPOSITS: true

misc:
  MEMSWAP_FACTOR: 0
  USE_PRINT: false
  VALIDATE_ON_IMPORT: true
  CONFIGURATION_REQUIRED: false

hashing:
  # Main hash selector for service/file identification.
  # Accepts sha2_256, sha3_256, shake_256, blake2b_256 (each also accepts its
  # older/shorter alias: sha256, sha3, shake, blake2b, blake2) or a hash-id in hex.
  HASH: "sha3_256"
  # If true, run integrity check/migration automatically when starting `nodo serve`.
  CHECK_INTEGRITY_ON_SERVE: false

# Core services are Celaut services the node treats as part of its OWN workflow,
# referenced by service id (content hash) — never by URL. They let the node bootstrap
# capabilities it doesn't ship with: e.g. resolving and auto-downloading a service that
# `nodo execute` is asked to run but doesn't have locally.
#
# This is a mapping of role -> published service id (content hash). The key is the
# well-known role the node looks up (currently: "source-application", "packer" and
# "low-demand-fallback"); the value is the id for that role.
#
# Trust model: the auto-download fallback in `nodo execute` will only resolve+run a missing
# service if it is reachable through one of these *configured* core services. An empty mapping
# or a "<SET_ME>" placeholder disables the fallback (the node fails closed with the existing
# "Service not allowed." behaviour) — it never invents an id or an arbitrary download source.
core_services:
  # source-application: a directory/registry that maps a service id -> its available sources
  # (manifest URLs), so the node can fetch a service it doesn't have. The published id is not
  # wired yet; leave as "<SET_ME>" until it is available, then the execute auto-download path
  # activates. The read endpoint is derived from publisher.SOURCE_APPLICATION_WEB_PAGE below.
  source-application: "<SET_ME>"
  # packer: the packer-service core service used by `nodo pack` to build services in a
  # sealed microVM. The published id is not wired yet; leave as "<SET_ME>" until it is
  # available, then `nodo pack` can resolve a running packer instance by this id.
  packer: "<SET_ME>"
  # low-demand-fallback: an opportunistic best-effort service the node runs ONLY when it
  # has spare capacity (see the `low_demand:` block below) and no real workloads. It is
  # always preempted by real/paid `execute` requests. The published id is not wired yet;
  # leave as "<SET_ME>" until it is available. See docs/design/low-demand-fallback.md.
  low-demand-fallback: "<SET_ME>"

# Opportunistic low-demand fallback scheduler (WIP — see docs/design/low-demand-fallback.md).
# When ENABLED and the node is under ALL per-resource thresholds AND not serving real
# workloads, it opportunistically runs the "low-demand-fallback" core service; a real
# execute request or crossing any threshold preempts (stops) it. Thresholds are the
# "environment-variable" levels below which the fallback is allowed to run.
# The scheduler is driven from the manager loop (src/manager/maintain.py) and is a no-op
# unless ENABLED is true; preemption always STOPS the fallback (there is no pause primitive).
low_demand:
  ENABLED: false                  # master switch; opportunistic fallback is OFF by default.
  POLL_INTERVAL: 30               # seconds between idle checks (independent of MANAGER_ITERATION_TIME).
  CPU_MAX_PERCENT: 40             # run the fallback only when system CPU usage is <= this percent.
  MEM_MAX_PERCENT: 60             # run the fallback only when system memory usage is <= this percent.
  LOW_DEMAND_CONSECUTIVE_POLLS: 3 # consecutive below-threshold, idle polls required before starting (hysteresis).
  # Future per-resource thresholds (e.g. GPU_MAX_PERCENT, DISK_MAX_PERCENT) go here.

publisher:
  PROVIDER: "github"
  REPOSITORY: "owner/repo"
  BRANCH: "main"
  SOURCE_APPLICATION_WEB_PAGE: "https://reputation-systems.github.io/source-application?tab=add"
  # How a freshly-published source gets registered, resolved across four levels:
  #   1. AUTO_PUBLISH_TX true + SOURCE_PROFILE_BOX_ID set + a configured "source-application"
  #      core service -> the FILE_SOURCE opinion is published directly via the instance's
  #      REST API (POST /api/sources {mainBoxId, fileHash, sourceEntry}). The node
  #      AUTO-LAUNCHES the source-application in seed mode (see below) if one isn't already
  #      running, so it signs + submits the tx itself. No click.
  #   2. running instance but auto-submit off/unavailable, SOURCE_APPLICATION_WEB_PAGE set
  #      -> prints a prefilled click-to-add link on the web app (the instance serves only
  #         /api + /mcp JSON, never the prefill form).
  #   3. no running instance but SOURCE_APPLICATION_WEB_PAGE set (above)
  #      -> prints the same prefilled click-to-add link (pre-existing behaviour).
  #   4. nothing usable -> a manual-registration message (file hash + content hash + manifest URL).
  # The instance is the "source-application" entry under core_services (resolved by id).
  #
  # AUTO_PUBLISH_TX does NOT send the wallet seed over HTTP. Instead the node launches the
  # on-node source-application instance in seed mode, injecting the wallet into its env
  # (SOURCE_SIGNER_MODE=seed, SOURCE_MNEMONIC=<ledgers.ergo.WALLET_MNEMONIC>,
  # SOURCE_NODE_URI=<ledgers.ergo.NODE_URL>). Requires ledgers.ergo.WALLET_MNEMONIC to be
  # set. NOTE: if a source-application instance is ALREADY running (e.g. in unsigned mode),
  # its env is used as-is and the node will not relaunch it; it then returns an unsigned tx
  # and the publisher falls back to a link. Keep AUTO_PUBLISH_TX false unless you want this
  # node to sign source transactions with its wallet.
  AUTO_PUBLISH_TX: false
  # The node's reputation PROFILE box id (its on-chain author identity). Required for
  # AUTO_PUBLISH_TX: every FILE_SOURCE opinion is split from this box. Mint a profile once
  # (source-application web app, or POST /api/profile on a seed-mode instance, then look up
  # the resulting box), and paste its 64-hex box id here. Leave empty to disable level 1.
  SOURCE_PROFILE_BOX_ID: ""
  # Formats can be file extensions (tags) or ergo box ids that define the format uniquely.
  CONTENT_FORMAT: ".grpcbb"
  RAW_FORMAT: ".celaut"
  # Direct token in config (optional).
  TOKEN: ""
  # Environment variable names read by ConfigManager-based scripts (optional).
  TOKEN_ENV_VAR: "CLOUD_TOKEN"
  # Optional direct fallback token.
  FALLBACK_TOKEN: ""
  FALLBACK_TOKEN_ENV_VAR: "GITHUB_TOKEN"
  CHUNK_SIZE_MB: 24
  UPLOADS_PREFIX: "uploads"
  TIMEOUT_SECONDS: 300
  MAX_RETRY: 3
  BACKOFF_SECONDS: 2
  DOWNLOAD_OUTPUT_DIR: "${main.STORAGE}/published_downloads"
  KEEP_DOWNLOADED_FILE: true
  AUTO_IMPORT_SERVICE_ON_DOWNLOAD: true

general_flags:
  SIMULATE_PAYMENTS: false
  SUBMIT_REPUTATION_AT_INIT: false
  # Publish how to reach this node (network.PUBLIC_IP or, if empty, the outbound IP
  # when it is publicly routable) on its own reputation proof. Private/LAN addresses
  # are never published, so a node behind NAT must set network.PUBLIC_IP to advertise.
  SUBMIT_NETWORK_ADDRESS_TO_REPUTATION_PROOF: true

# Reputation and payments are configured per-ledger, under ledgers.<ledger>.
# There is a SINGLE Ergo wallet (ledgers.ergo.WALLET_MNEMONIC). Clients pay
# directly to its derived P2PK address; excess is swept to a cold wallet
# (public address only) once both thresholds below are met:
#     client  ->  single wallet  ->  cold wallet (when both thresholds met)
ledgers:
  ergo:
    tags: [ ergo ]
    NODE_URL: "https://node.sigmaspace.io"
    GENESIS_BLOCK_ID: "b0244dfc267baca974a4caee06120321562784303a8a688976ae56170e4d175b"
    # The ONE mnemonic of the whole node. It is both the wallet the node controls and
    # its identity: the key it signs GetPeerInfo with, and whose public key IS the
    # peer_id other nodes store for it (issue #236). Leave empty (or "auto") and a
    # fresh one is generated on first load -- a node always needs an identity, and
    # generating a mnemonic commits to nothing, since the wallet holds no funds until
    # someone sends some.
    #
    # TREAT AS A SECRET, and back it up: losing it means losing both the funds and the
    # node's identity, and changing it makes every peer see a brand-new node, orphaning
    # the deposits and reputation recorded against the old one.
    WALLET_MNEMONIC: ""
    HTTP_PEERS_PATH: "${main.STORAGE}/ergo_http_peers.json"
    reputation:
      LEDGER_REPUTATION_SUBMISSION_THRESHOLD: 10
      TOTAL_REPUTATION_TOKEN_AMOUNT: 1000000000
      REPUTATION_PROOF_ID: ""
      PLAIN_TEXT_TYPE_NFT_ID: "8299d98e15ebee7fa39ad716de7c8bb191790a1bf4b7c3f91af35a0e36187706"
      CELAUT_NODE_TYPE_NFT_ID: "64060577c3393e0e3cf8938ec8e6a2002ded27ece17750aa5add7d5c3e1227ba"
    payments:
      # What one nanoERG buys, in MU. This is the ONE place the node's unit of account
      # meets real money; it is what peers are told as ContractRate.mu_per_unit, so they
      # can convert this node's prices into something they can compare.
      #
      # 1 is the sensible default: Ergo is the only payment system, so the simplest
      # mapping is the right one, and it makes one MU one nanoERG. Change it only to
      # rescale what MU means against ERG -- and if you do, re-read `pricing:`, since
      # the two have to stay on the same scale (the node warns at startup if a
      # reference charge would convert to zero nanoERG).
      #
      # Note that ERG <-> nanoERG (1e9) is NOT configurable: it is fixed by the Ergo
      # protocol and lives in the code.
      MU_PER_NANOERG: 1
      PAYMENT_MANAGER_ITERATION_TIME: 86400
      # Maximum balance (ERG, decimal string) retained in the operational wallet.
      HOT_WALLET_LIMITS: "100"
      # Public Ergo address funds are swept to. Empty disables sweeping. Never a mnemonic.
      COLD_WALLET: ""
      # Minimum sweep amount (ERG, decimal string). Prevents dust transfers.
      COLD_WALLET_MIN_TRANSFER: "1"
      DONATION_WALLET: "9gGZp7HRAFxgGWSwvS4hCbxM2RpkYr6pHvwpU4GPrpvxY7Y2nQo"
      DONATION_PERCENTAGE: "0.00"
