main:
  MAIN_DIR: "/nodo"
  STORAGE: "/nodo/storage"
  CACHE: "${main.STORAGE}/__cache__/"
  REGISTRY: "${main.STORAGE}/__registry__/"
  METADATA_REGISTRY: "${main.STORAGE}/__metadata__/"
  BLOCKDIR: "${main.STORAGE}/__block__/"
  DATABASE_FILE: "${main.STORAGE}/database.sqlite"

dependencies:
  java:
    RUNTIME_ROOT: "${main.MAIN_DIR}/runtime/java"
    JAVA_HOME: "${main.MAIN_DIR}/runtime/java/current"
  python:
    RUNTIME_BIN: "${main.MAIN_DIR}/runtime/python/current/bin/python3"
    VENV_BIN: "${main.MAIN_DIR}/venv/bin/python"
    RUNTIME_ROOT: "${main.MAIN_DIR}/runtime/python"
  yq:
    BIN: "${main.MAIN_DIR}/bin/yq"
  docker:
    BIN: "${main.MAIN_DIR}/bin/docker"
    DAEMON_BIN: "${main.MAIN_DIR}/bin/dockerd"
    BUILDX_BIN: "${main.MAIN_DIR}/libexec/docker/cli-plugins/docker-buildx"

virtualizers:
  DEFAULT_VIRTUALIZER: ch
  docker:
    DOCKER_CLIENT_TIMEOUT: 480
    DOCKER_MAX_CONNECTIONS: 1000
    CONCURRENT_CONTAINER_CREATIONS: 10
    REMOVE_CONTAINERS: true
    # Isolated Docker configuration - uses a separate daemon from user's Docker
    DOCKER_SOCKET: "${main.MAIN_DIR}/docker/docker.sock"
    DOCKER_DATA_ROOT: "${main.MAIN_DIR}/docker/data"
    DOCKER_CONFIG_DIR: "${main.MAIN_DIR}/docker/config"
    DOCKER_NETWORK: "docker0"
    # Security options applied to service containers.
    SECURITY_APPARMOR_UNCONFINED: false
    SECURITY_SELINUX_DISABLE_LABEL: false
    SECURITY_NO_SECCOMP: false  # This option disables seccomp security profiles, use with caution.
    SECURITY_PRIVILEGED: false  # This option gives the container full access to the host, use with caution.
  ch:
    BINARY_PATH: ""
    KERNEL_PATHS:
      linux/amd64: "${main.MAIN_DIR}/ch/kernels/linux/amd64/vmlinuz"
      linux/arm64: "${main.MAIN_DIR}/ch/kernels/linux/arm64/vmlinuz"
    INITRAMFS_PATHS:
      linux/amd64: "${main.MAIN_DIR}/ch/initramfs/linux/amd64/initramfs"
      linux/arm64: "${main.MAIN_DIR}/ch/initramfs/linux/arm64/initramfs"
    CACHE_DIR: "${main.CACHE}/ch"
    # Keep this path short to avoid Unix socket SUN_LEN limits.
    API_SOCKET_DIR: "/tmp/nodo-ch"
    NETWORK_MODE: "tap_bridge"
    NETWORK_BRIDGE_NAME: "br-ch"
    NETWORK_SUBNET: "192.168.200.0/24"
    NETWORK_GATEWAY_IP: "192.168.200.1"
    # Guest interface used by the kernel ip=... cmdline.
    # Use "auto" to avoid hardcoding (recommended), or set e.g. "eth0".
    GUEST_NET_DEVICE: "auto"
    # Extra kernel cmdline parameters for guest boot diagnostics.
    # Keep console=ttyS0 so serial logs receive kernel/init output.
    KERNEL_CMDLINE_EXTRA: "console=ttyS0"
    # Fail fast if the guest does not become reachable on the bridge network.
    GUEST_NETWORK_READY_TIMEOUT_S: 20
    # Memory policy for VM boot:
    # - MIN_MEM_MIB is only the floor needed to boot lightweight workloads.
    # - Services requiring more memory must request it explicitly in sysresources.
    MIN_MEM_MIB: 128
    DEFAULT_MEM_MIB: 256
    # cgroup v2 root path for per-VM lifecycle hotplug controls.
    CGROUPS_BASE_DIR: "/sys/fs/cgroup"
    # Guest output streams for debug:
    # SERIAL_MODE: file|off|null|tty|file=/custom/path.log
    # CONSOLE_MODE: off|null|tty|file=/custom/path.log
    SERIAL_MODE: "file"
    CONSOLE_MODE: "off"
    CONSERVE_RUNTIME_DIR_ON_FAILURE: true
    # Shared-disk (virtiofs) networks.
    # Path to the virtiofsd binary that exports each network's shared directory.
    VIRTIOFSD_PATH: "virtiofsd"
    # virtiofsd confinement for the exported directory: none|chroot|namespace.
    # Default chroot (deny-by-default, no cross-network access).
    VIRTIOFS_SANDBOX: "chroot"
    # Opt-in: seed a virtiofs instance onto a REMOTE peer that already hosts its
    # shared-disk network (co-locate there) instead of always seeding locally.
    # Probes peers via GetNetworkInstances; denied/unavailable probes fall back
    # to safe local seeding. Leave false unless peers authorize node-to-node
    # network discovery.
    VIRTIOFS_DISTRIBUTED_SEEDING: false
    SECURITY:
      # Enforce rootfs destination confinement for all filesystem paths.
      PATH_CONFINEMENT: true
      # Device nodes policy for filesystem xattrs: deny|allowlist
      DEVICE_NODES_POLICY: "deny"
      # Allowlist entries apply only when DEVICE_NODES_POLICY=allowlist.
      # Example:
      # - path: "/dev/null"
      #   type: "char"   # char|block
      #   major: 1
      #   minor: 3
      #   mode: "0666"   # optional permission mode (setuid/setgid/sticky forbidden)
      DEVICE_NODE_ALLOWLIST: []
      # When true, allowlist device nodes only for trusted service IDs.
      REQUIRE_TRUSTED_SERVICE_FOR_DEVICES: true
      # Explicit list of trusted service hashes allowed to use device node allowlist.
      TRUSTED_SERVICE_IDS: []
      # Reserved hook for future rootfs build sandboxing strategy.
      ROOTFS_BUILD_SANDBOX: "none"
      # When true, if a VM fails to boot or encounters an error, its runtime directory will be preserved for debugging instead of being deleted.

builder:
  WAIT_FOR_CONTAINER: 60
  WAIT_FOR_UNLOCK_MEMORY: 60
  BUILD_CONTAINER_MEMORY_SIZE_FACTOR: 3.1
  ARM_SUPPORT: true
  X86_SUPPORT: true
  TRUST_METADATA_ARCHITECTURE: false

packer:
  SAVE_ALL: false
  PACKER_MEMORY_SIZE_FACTOR: 2.0
  ARM_PACKER_SUPPORT: true
  X86_PACKER_SUPPORT: true
  docker:
    # Network used for docker buildx builds. "host" helps ensure DNS is reachable.
    BUILDX_NETWORK: "host"
    # Buildx builder name used for builds (created if missing).
    BUILDX_BUILDER: "nodo-hostnet"

network:
  GATEWAY_PORT: auto
  LOCAL_NETWORK: "lo"
  PUBLIC_IP: ""  # Optional public IP or DNS name to advertise for `nodo execute --remote`. Leave empty to auto-detect from the default outbound interface.
  EXTERNAL_INTERFACE: ""  # Optional interface name to use when PUBLIC_IP is empty, e.g. "eth0".
  # If true, child instances launched by internal instances are NOT exposed on the host.
  # If false, child instances will be published and reachable from the internet (subject to host firewall).
  ISOLATE_INTERNAL_CHILDREN: true
  CONSIDER_DEV_AS_INTERNAL: true  # If true, instances with "dev" in their father_id are considered internal regardless of actual network location. Use false in case node is controlled via ssh session for example.
  DISABLE_EXPOSE_OUTSIDE: false  # If true, no instances will be exposed outside regardless of other settings. Use for maximum isolation. QUIC tunnel will be need to access services from outside in this case.
  FREE_PORTS_RANGE:  # Free ports range to use for exposing services. Ports outside this range will not be used for service exposure. Useful to match router forwarding rules. Can be multiple ranges, e.g.: - START: 10000 \n END: 20000 \n - START: 30000 \n END: 40000
    - START: 50000
      END: 60000
  DEFAULT_EXECUTE_REMOTE: false  # If true, `nodo execute` will default to remote execution. Use for nodes running in environments without reliable public IPs or with strict isolation requirements, e.g. on-premises servers behind NAT or in private cloud VPCs, or WSL2 Windows nodes.

logs:
  MEMORY_LOGS: false
  DEBUG_MODE: false

costs:
  DEFAULT_INITIAL_GAS_AMOUNT_FACTOR: 1.0e-6
  USE_DEFAULT_INITIAL_GAS_AMOUNT_FACTOR: false
  DEFAULT_INITIAL_GAS_AMOUNT: 1.0e+9
  TOTAL_REFILLED_DEPOSIT: 1.0e+64
  MIN_DEPOSIT_PEER: 1.0e+32
  FREE_TRIAL_GAS_AMOUNT: 1.0e+66
  INITIAL_PEER_DEPOSIT_FACTOR: 0.5
  DEV_CLIENT_GAS_AMOUNT: 1.0e+256
  INIT_COST_CONFIGURATION_FACTOR: 1
  MAINTENANCE_COST_CONFIGURATION_FACTOR: 1.0e+6
  SOCIALIZATION_FACTOR: 2
  COST_AVERAGE_VARIATION: 1
  FREE_GAS_THRESHOLD: 0
  EXECUTION_COST: 100.0
  EXECUTION_BENEFIT: 100.0
  BUILD_COST: 10.0
  MODIFY_RESOURCES_COST: 100.0
  ALLOW_GAS_DEBT: true

timing:
  GENERAL_WAIT_TIME: 2
  GENERAL_ATTEMPTS: 10
  MANAGER_ITERATION_TIME: 10
  SHORT_INTERVAL_COUNT: 20
  COMMUNICATION_ATTEMPTS: 1
  COMMUNICATION_ATTEMPTS_DELAY: 60
  CLIENT_EXPIRATION_TIME: 1200
  EXTERNAL_COST_TIMEOUT: 10
  START_SERVICE_ON_PEER_TIMEOUT: 120

communication:
  SELF_ANNOUNCE_TO_CONNECTING_PEERS: false
  SEND_ONLY_HASHES_ASKING_COST: true
  DENEGATE_COST_REQUEST_IF_DONT_VE_THE_HASH: false

client:
  MIN_SLOTS_OPEN_PER_PEER: 1
  CLIENT_MIN_GAS_AMOUNT_TO_RESET_EXPIRATION_TIME: 1.0e+3
  DEV_CLIENT_POOL_SIZE: 1
  DEV_EXTERNAL_CLIENT_POOL_SIZE: 1

misc:
  MIN_BUFFER_BLOCK_SIZE: 1.0e+7
  MEMSWAP_FACTOR: 0
  USE_PRINT: false
  VALIDATE_ON_IMPORT: true
  CONFIGURATION_REQUIRED: false

hashing:
  # Main hash selector for service/file identification.
  # Accepts hash aliases (sha3_256, sha256, shake_256, blake2b) or a hash-id in hex.
  HASH: "sha3_256"
  # If true, run integrity check/migration automatically when starting `nodo serve`.
  CHECK_INTEGRITY_ON_SERVE: false

publisher:
  PROVIDER: "github"
  REPOSITORY: "owner/repo"
  BRANCH: "main"
  SOURCE_APPLICATION_WEB_PAGE: "https://reputation-systems.github.io/source-application?tab=add"
  # Formats can be file extensions (tags) or ergo box ids that define the format uniquely.
  CONTENT_FORMAT: ".grpcbb"
  RAW_FORMAT: ".celaut"
  # Direct token in config (optional).
  TOKEN: ""
  # Environment variable names read by ConfigManager-based scripts (optional).
  TOKEN_ENV_VAR: "CLOUD_TOKEN"
  # Optional direct fallback token.
  FALLBACK_TOKEN: ""
  FALLBACK_TOKEN_ENV_VAR: "GITHUB_TOKEN"
  CHUNK_SIZE_MB: 24
  UPLOADS_PREFIX: "uploads"
  TIMEOUT_SECONDS: 300
  MAX_RETRY: 3
  BACKOFF_SECONDS: 2
  DOWNLOAD_OUTPUT_DIR: "${main.STORAGE}/published_downloads"
  KEEP_DOWNLOADED_FILE: true
  AUTO_IMPORT_SERVICE_ON_DOWNLOAD: true

general_flags:
  SIMULATE_PAYMENTS: false
  SUBMIT_REPUTATION_AT_INIT: false
  SUBMIT_NETWORK_ADDRESS_TO_REPUTATION_PROOF: true

# Reputation and payments configuration should be set in the ledgers section, depending on the ledger being used.
reputation:
  LEDGER_REPUTATION_SUBMISSION_THRESHOLD: 10
  TOTAL_REPUTATION_TOKEN_AMOUNT: 1000000000
  REPUTATION_PROOF_ID: ""
  PLAIN_TEXT_TYPE_NFT_ID: "8299d98e15ebee7fa39ad716de7c8bb191790a1bf4b7c3f91af35a0e36187706"
  CELAUT_NODE_TYPE_NFT_ID: "64060577c3393e0e3cf8938ec8e6a2002ded27ece17750aa5add7d5c3e1227ba"

payments:
  PAYMENT_MANAGER_ITERATION_TIME: 86400
  PAYMENTS_RECEIVER_WALLET: ""
  DONATION_WALLET: "9gGZp7HRAFxgGWSwvS4hCbxM2RpkYr6pHvwpU4GPrpvxY7Y2nQo"
  DONATION_PERCENTAGE: "0.00"

ledgers:
  ergo:
    tags: [ ergo ]
    GAS_PER_ERG: 1.0e+58
    NODE_URL: "https://node.sigmaspace.io"
    GENESIS_BLOCK_ID: "b0244dfc267baca974a4caee06120321562784303a8a688976ae56170e4d175b"
    HOT_WALLET_LIMITS: 100
    WALLET_MNEMONIC: ""
    AUXILIARY_MNEMONIC: ""
    HTTP_PEERS_PATH: "${main.STORAGE}/ergo_http_peers.json"
