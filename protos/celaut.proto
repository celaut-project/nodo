syntax = "proto3";
package celaut;

import "buffer.proto";

// -----------------------
// CEL•AUT MESSAGES
// -----------------------

// Describes available data formats with optional tags, human-readable prose, and binary representation.
message DataFormat {
    repeated string tags = 1;
    string prose = 2;
    bytes formal = 3;
}

// Represents both, payment contracts and reputation proofs.
message Contract {
    message Ledger {
        repeated string tags = 1;
        string prose = 2;
        bytes formal = 3;
    }
    Ledger ledger = 1;
    map<string, bytes> xattrs = 2;
}

// Defines an abstract amount of gas (cost unit) as a numeric string.
message GasAmount {
    string n = 1;
}

// Associates a payment contract ledger with a gas amount (price).
message GasPrice {
    Contract contract = 1;
    GasAmount gas_amount = 2;
}

// Metadata structure with optional hashtags, data format, and reputation proofs.
message Metadata {
    message HashTag {
        message Hash {
            // Type of hash (e.g., SHA256).
            bytes type = 1;
            // Hash value bytes.
            bytes value = 2;
        }
        message AttrHashTag {
            // Field index for repeated attributes.
            int32 key = 1;
            // List of hashtags for each element in a repeated field.
            repeated HashTag value = 2;
        }
        repeated Hash hash = 1;
        repeated string tag = 2;
        repeated AttrHashTag attr_hashtag = 3;
    }
    optional HashTag hashtag = 1;
    optional DataFormat format = 2;
    repeated Contract reputation_proofs = 3;
}

// -----------------------
// SERVICE SPECIFICATION
// Defines how a service is described: API, container, network.
// -----------------------

message Service {
    // API: Defines service ports, protocols, payment contracts, and cost model.
    message Api {
        message Protocol {
            repeated string tags = 1;
            string prose = 2;
            bytes formal = 3;
        }
        message Slot {
            // Port number for this slot.
            int32 port = 1;
            // Transport protocol
            Protocol transport = 2;
            // Protocol stack definitions for this slot.
            repeated Protocol protocol_stack = 3;
            // Gas amount per declared method in protocol_stack.
            map<string, GasAmount> gas_amount_per_call = 4;
        }

        repeated Slot slot = 1;

        // Accepted payment contracts with conversion to gas.
        repeated GasPrice payment_contracts = 2;
        
        /*
         The cost of the service is measured in "gas":
           1. Initial fixed cost (one-time).
           2. Usage-based cost (variable).
         Detailed cost rules are specified within the API protocol.
        */
    }

    // A single possible concurrent execution scenario for the descendant
    // services this service may spawn during its lifetime. Scenarios are
    // independent: they are NOT cumulative and imply no temporal ordering.
    // The scheduler only needs to determine whether each scenario, in
    // isolation, could be satisfied by the network. Unlike `resources`
    // (which describe this instance itself), these describe its descendants.
    message PossibleEnvironmentWorkload {
        // One group of identical concurrent descendant workloads.
        message Workload {
            // Identifies the service responsible for this workload. The
            // message may be omitted when the workload is resource-only.
            message Dependency {
                // Known content hashes for the dependency service.
                repeated Metadata.HashTag.Hash hash = 1;
                // Full or partial dependency specification.
                Service service = 2;
                // True when `service` is complete, so its hashes can be
                // calculated and verified against `hash`.
                bool is_completed = 3;
                // True when the complete dependency is stored in this
                // service's filesystem (for example, as a celaut.bee passed
                // later to the node's Execute method).
                bool on_filesystem = 4;
            }

            // Number of concurrent descendant instances that require `resources`.
            uint32 count = 1;
            // Resources each of those descendant instances may require.
            Sysresources resources = 2;
            // Dependency identity/specification, if this workload is tied to
            // a particular service. Message presence distinguishes an omitted
            // dependency from an explicitly populated one.
            Dependency dependency = 3;
        }
        repeated Workload workloads = 1;
    }

    message Container {
        
        message Architecture {
            repeated string tags = 1;
            string prose = 2;
            bytes formal = 3;
        }
        
        message Filesystem {
            message ItemBranch {
                message Link {
                    string src = 1;
                    string dst = 2;
                }
                // Identifier for the file or folder name.
                string name = 1;
                oneof item {
                    // Raw file bytes.
                    bytes file = 2;
                    // Symbolic link.
                    Link link = 3;
                    // Nested filesystem tree.
                    Filesystem filesystem = 4;
                }
                map<string, bytes> xattrs = 5;
            }
            repeated ItemBranch branch = 1;
        }
        
        message Init {
            repeated string entry_path = 1;
            map<string, bytes> xattrs = 2;
        }

        message ConfigDeclaration {
            repeated string path = 1;
            DataFormat format = 2;
        }

        message Resources {
            // Initial system requirements.
            Sysresources at_init = 1;

            // Maximum system requirements.
            Sysresources at_most = 2;
        }

        // CPU architecture and environment description.
        Architecture architecture = 1;
        
        // Serialized filesystem.
        bytes filesystem = 2;
        
        // Entrypoint and startup metadata for the container.
        Init init = 3;
        
        // Container resource 
        optional Resources resources = 4;

        ConfigDeclaration config_declaration = 5;
        
        // Expected node protocol stack for internal node logic.
        repeated Api.Protocol node_protocol_stack = 6;

        // Environment variables for the execution environment.
        // (Moved here from Service.Api: env vars belong to the container that
        // runs the code, not to the communication interface.)
        map<string, DataFormat> environment_variables = 7;

    }

    // A Network is a *logical communication domain* between service
    // instances. It only describes:
    //   - which peers the service wants to communicate with (tags/prose/formal);
    //   - which protocols those peers are expected to expose (protocol_stack).
    //
    // Shared disks / VirtioFS / filesystem inheritance are NOT networks.
    // Those are an execution-environment concern expressed through
    // Container.Filesystem.ItemBranch.xattrs (see shared/guest/access).
    message Network {
        repeated string tags = 1;
        string prose = 2;
        bytes formal = 3;

        // Protocol stack expected from the peers in this communication domain.
        repeated Api.Protocol protocol_stack = 4;

        // Name of an environment variable used to filter compatible peer
        // instances during ConfigurationFile.NetworkResolution. Only peers
        // whose value for this environment variable matches the requesting
        // instance's value are returned. Empty => no env-based filtering.
        //
        // Example: many PostgreSQL instances may exist on the network, but
        // only those sharing the same value of e.g. "PG_CLUSTER" are peers.
        string environment_variable = 5;
    }

    // Natural language description.
    string prose = 1;

    // Container configuration.
    Container container = 2;
    
    // API definition.
    Api api = 3;
    
    // Network definitions.
    repeated Network network = 4;

    // Worst-case descendant workload scenarios this service may request.
    // This belongs to the service-level execution environment rather than to
    // its container representation. Spec-only: nodo's scheduler interpretation
    // and validation are intentionally NOT part of this change (#163).
    repeated PossibleEnvironmentWorkload possible_environment_workload = 5;
}

message Instance {
    message Uri {
        string ip = 1;
        int32 port = 2;
    }
    message Uri_Slot {
        int32 internal_port = 1;
        repeated Uri uri = 2;
    }
    // API endpoints exposed by this instance.
    Service.Api api = 1;
    // Mapping of internal ports to external URIs.
    repeated Uri_Slot uri_slot = 2;
}

// -----------------------
// SERVICE INSTANCE CONFIGURATION
// -----------------------

message Configuration {
    // Environment variables for gateway services.
    map<string, bytes> environment_variables = 1;

    // Service specification slots.
    repeated int32 spec_slot = 2;

    // Optional initial gas deposit for service execution.
    optional GasAmount initial_gas_amount = 3;
}

message ConfigurationFile {
    message NetworkResolution {
        repeated string tags = 1;
        repeated Instance peer_instances = 2;
    }
    // Gateway instance settings.
    Instance gateway = 1;
    // Combined configuration options.
    Configuration config = 2;
    // Network discovery of peers.
    repeated NetworkResolution network_resolution = 3;
    // Initial system resource allocation for services.
    Sysresources initial_sysresources = 4;
}

// -----------------------
// SYSTEM RESOURCES
// Defines resource limits and weights for container updates.
// -----------------------

message Sysresources {
    // Block I/O weight (relative), 10–1000.
    optional uint64 blkio_weight = 1;
    // CFS CPU period in microseconds.
    optional uint64 cpu_period = 2;
    // CFS CPU quota in microseconds.
    optional uint64 cpu_quota = 3;
    // Memory limit in bytes.
    optional uint64 mem_limit = 4;
    // Disk space limit in bytes.
    optional uint64 disk_space = 5;
}

// -----------------------
// GATEWAY MESSAGES
// -----------------------

message TokenMessage {
    string token = 1;
    optional string slot = 2;
}

message EstimatedCost {
    GasAmount cost = 1;
    GasAmount init_maintenance_cost = 2;
    GasAmount max_maintenance_cost = 3;
    int32 maintenance_seconds_loop = 4;
    float variance = 5;
}

message Refund {
    GasAmount amount = 1;
}

message SignRequest {
    string public_key = 1;
    string to_sign = 2;
}

message SignResponse {
    string signed = 1;
}

message Payment {
    string deposit_token = 1;
    Contract contract = 2;
    GasAmount gas_amount = 3;
}

message Metrics {
    GasAmount gas_amount = 1;
}

message ServiceInstance {
    string token = 1;
    Instance instance = 2;
}

message Peer {
    repeated Contract reputation_proofs = 1;
    Instance instance = 2;
}

message Client {
    string client_id = 1;
}

message RecursionGuard {
    string token = 1;
}

message ModifyServiceSystemResourcesOutput {
    Sysresources sysreq = 1;
    GasAmount gas = 2;
}

message ModifyServiceSystemResourcesInput {
    Sysresources min_sysreq = 1;
    Sysresources max_sysreq = 2;
}

message ModifyGasDepositInput {
    GasAmount gas_difference = 1;
    string service_token = 2;
}

message ModifyGasDepositOutput {
    bool success = 1;
    string message = 2;
}

// Observe: live instance observability stream (see src/commands/observe.py).
// Input: which instance to observe (id/token, as GetMetrics addresses it).
message ObserveRequest {
    string instance_id = 1;    // instance id / token (TokenMessage.token semantics).
    bool include_packets = 2;  // opt-in per-packet records; metrics snapshots are the baseline.
}

// One live observability event. ``kind`` names the populated payload so a
// consumer can switch without inspecting the oneof. Fields mirror what
// observe.py writes to metrics.jsonl (metrics) and serialize_event (packet).
message ObserveEvent {
    string time = 1;  // HH:MM:SS, matching metrics.jsonl timestamps.
    string kind = 2;  // "session" | "metrics" | "packet" | "notice".

    // Emitted once, first: how capture was resolved for this instance.
    message Session {
        string instance_id = 1;
        string tag = 2;
        string capture_mode = 3;     // "pcap" (AF_PACKET tap) | "conntrack" (fallback).
        string degraded_reason = 4;  // empty when full AF_PACKET capture is live.
        int32 link_type = 5;         // libpcap LINKTYPE for the global header (1=ethernet, 101=raw IP).
        uint32 snaplen = 6;          // capture snap length for the pcap global header.
        string gas = 7;              // instance gas balance at attach (celaut GasAmount numeric string); "" when unknown.
    }

    // One CPU+memory sample (the fields of observe.metrics_record).
    message Metrics {
        bool alive = 1;
        optional double cpu_percent = 2;
        optional double cpu_peak_percent = 3;
        optional uint64 mem_bytes = 4;
        optional uint64 mem_peak_bytes = 5;
        // Cumulative block-IO bytes for this instance: cgroup io.stat when
        // the io controller is delegated to the leaf, else the hypervisor
        // process's /proc/<pid>/io read_bytes/write_bytes.
        optional uint64 disk_read_bytes = 6;
        optional uint64 disk_write_bytes = 7;
        // Cumulative tap-interface counters. rx = frames the host received from
        // the VM (VM egress); tx = frames sent to the VM (VM ingress).
        optional uint64 net_rx_bytes = 8;
        optional uint64 net_tx_bytes = 9;
        optional uint64 net_rx_packets = 10;
        optional uint64 net_tx_packets = 11;
        // Instance gas balance at this sample (celaut GasAmount numeric string),
        // re-read each tick so a consumer sees it spent live. "" when unknown.
        string gas = 12;
    }

    // One parsed connection event (the fields of observe.serialize_event).
    message Packet {
        string direction = 1;           // "IN" | "OUT" (derived from the IP header).
        string transport = 2;           // tcp | udp | icmp ...
        string protocol = 3;            // display label (transport upper-cased).
        string tcp_flags = 4;
        string src = 5;                 // ip:port
        string dst = 6;                 // ip:port
        optional uint32 frame_len = 7;  // captured bytes (pcap path only).
        string peer_kind = 8;           // "instance" | "external".
        string peer_instance_id = 9;    // set when peer_kind == "instance".
        string peer_tag = 10;
        string peer_relationship = 11;  // parent | child | peer.
        string peer_host = 12;          // set when peer_kind == "external".
        string source = 13;             // "pcap" | "conntrack".
        // Verbatim captured frame + kernel receive time, so an include_packets
        // client can rebuild a byte-exact .pcap remotely. Only set in pcap mode
        // when include_packets is true (unset for conntrack / metrics-only).
        bytes raw_frame = 14;
        optional double frame_timestamp = 15;
    }

    // Degraded-mode / lifecycle message (never fabricated data).
    message Notice {
        string message = 1;
        bool degraded = 2;
    }

    oneof payload {
        Session session = 10;
        Metrics metrics = 11;
        Packet packet = 12;
        Notice notice = 13;
    }
}

// -----------------------
// GATEWAY SERVICE DEFINITION
// -----------------------

service Gateway {
    rpc StartService(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Configuration | Hash | Client | RecursionGuard | Service -> Instance
    rpc StopService(stream buffer.Buffer) returns (stream buffer.Buffer) {} // TokenMessage -> Refund
    rpc ModifyGasDeposit(stream buffer.Buffer) returns (stream buffer.Buffer) {} // ModifyGasDepositInput -> ModifyGasDepositOutput

    rpc GetPeerInfo(stream buffer.Buffer) returns (stream buffer.Buffer) {} //  -> Peer
    rpc IntroducePeer(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Peer -> 
    rpc GenerateClient(stream buffer.Buffer) returns (stream buffer.Buffer) {} //  -> Client
    rpc GenerateDepositToken(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Client -> TokenMessage
    rpc Payable(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Payment -> Empty
    rpc SignPublicKey(stream buffer.Buffer) returns (stream buffer.Buffer) {} // SignRequest -> SignResponse
    rpc ModifyServiceSystemResources(stream buffer.Buffer) returns (stream buffer.Buffer) {} // ModifyServiceSystemResourcesInput -> ModifyServiceSystemResourcesOutput
    rpc GetServiceEstimatedCost(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Metadata.HashTag.Hash & Service -> EstimatedCost
    rpc GetService(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Metadata.HashTag.Hash -> Service
    rpc GetMetrics(stream buffer.Buffer) returns (stream buffer.Buffer) {} // TokenMessage -> Metrics
    rpc ServiceTunnel(stream buffer.Buffer) returns (stream buffer.Buffer) {} // TokenMessage | bytes -> bytes
    rpc Observe(stream buffer.Buffer) returns (stream buffer.Buffer) {} // ObserveRequest(instance_id/token) -> stream ObserveEvent
}
