syntax = "proto3";
package celaut;

import "buffer.proto";

// -----------------------
// CEL•AUT MESSAGES
// -----------------------

// Describes available data formats with optional tags, human-readable prose, and binary representation.
message DataFormat {
    repeated string tags = 1;
    string prose = 2;
    bytes formal = 3;
}

// Represents both, payment contracts and reputation proofs.
//
// `xattrs` is where everything ledger-specific lives, so the message itself needs no
// field per ledger convention (see src/utils/contract_xattrs.py for the keys this
// implementation reads). On a reputation proof, two of them carry its OWNER
// ATTESTATION: `owner_public_key`, the key that published the proof in that ledger's
// own encoding, and `owner_signature`, that key's signature over the announcing peer's
// id (node_identity.attestation_payload).
//
// That pair is what attributes an on-chain fact to a peer without the peer's name
// having to be an on-chain object. A reputation proof on Ergo names its owner in R7,
// which is the reputation contract's spending clause (`INPUTS.exists {
// b.propositionBytes == SELF.R7[Coll[Byte]].get }`), so R7 can hold nothing but an Ergo
// proposition, ever. Reading it as the peer's id would therefore fix every celaut
// node's identity as an Ergo key by construction. With the attestation a reader checks
// two links instead -- R7 is the attested owner, and that owner signed this peer_id --
// which is the same fact, still verifiable from the proof box alone with no round-trip
// to the node (the box's R9 carries the whole signed Peer), and it holds for a second
// ledger's reputation system without either being privileged.
//
// It belongs to the proof and not to the Peer because ownership is a property of the
// proof: a node holds as many as it likes, and nothing says they share an owner. An
// attestation per ledger on the announcement could not describe two proofs on the same
// ledger published by different wallets.
//
// It proves possession of a key, and nothing more: not that the node accepts payment on
// that ledger (payment_contracts), nor that the key holds funds. A proof whose
// attestation does not verify is treated as announcing no owner at all -- the peer's
// identity is untouched, and only what a reader would have credited for that proof is
// lost. Covered by Peer.signature through reputation_proofs, so a relay can neither
// forge one (it would have to sign) nor strip one (the announcement would stop
// verifying).
message Contract {
    message Ledger {
        repeated string tags = 1;
        string prose = 2;
        bytes formal = 3;
    }
    Ledger ledger = 1;
    map<string, bytes> xattrs = 2;
}

// An amount in MU (monetary unit), as a numeric string.
//
// MU is the issuing node's own unit of account and has no intrinsic value. What one MU
// is worth is declared by each payment contract, as ContractRate.mu_per_unit, so a peer
// reading a price can convert it into money it understands -- that declaration is what
// the "gas" this replaced never had anywhere, which is why a price quoted in gas carried
// no information to whoever read it. Do NOT assume a peg: Ergo is currently the only
// payment system and defaults to 1 MU = 1 nanoERG, but that is a default the operator
// can rescale (ledgers.ergo.payments.MU_PER_NANOERG), not a definition. Read the rate.
//
// A string rather than an integer because a balance is unbounded.
message Amount {
    string n = 1;
}

// How much one unit of a payment contract is worth, in MU.
//
// This is what lets a node be paid in something other than ERG without giving up a
// common scale: ERG is simply the contract whose rate is the peg (1e9 MU per ERG), and
// another ledger declares its own.
message ContractRate {
    Contract contract = 1;
    Amount mu_per_unit = 2;
}

// Metadata structure with optional hashtags, data format, and reputation proofs.
message Metadata {
    message HashTag {
        message Hash {
            // Type of hash (e.g., SHA256).
            bytes type = 1;
            // Hash value bytes.
            bytes value = 2;
        }
        message AttrHashTag {
            // Field index for repeated attributes.
            int32 key = 1;
            // List of hashtags for each element in a repeated field.
            repeated HashTag value = 2;
        }
        repeated Hash hash = 1;
        repeated string tag = 2;
        repeated AttrHashTag attr_hashtag = 3;
    }
    optional HashTag hashtag = 1;
    optional DataFormat format = 2;
    repeated Contract reputation_proofs = 3;
}

// -----------------------
// SERVICE SPECIFICATION
// Defines how a service is described: API, container, network.
// -----------------------

message Service {
    // API: Defines service ports, protocols, payment contracts, and cost model.
    message Api {
        message Protocol {
            repeated string tags = 1;
            string prose = 2;
            bytes formal = 3;
        }
        message Slot {
            // Port number for this slot.
            int32 port = 1;
            // Transport protocol
            Protocol transport = 2;
            // Protocol stack definitions for this slot.
            repeated Protocol protocol_stack = 3;
            // MU charged per declared method in protocol_stack.
            map<string, Amount> mu_per_call = 4;
        }

        repeated Slot slot = 1;

        // Accepted payment contracts and what one unit of each is worth in MU.
        repeated ContractRate payment_contracts = 2;

        /*
         A service costs MU in two ways:
           1. Initial fixed cost (one-time).
           2. Usage-based cost (variable).
         Detailed cost rules are specified within the API protocol.
        */
    }

    // A single possible concurrent execution scenario for the descendant
    // services this service may spawn during its lifetime. Scenarios are
    // independent: they are NOT cumulative and imply no temporal ordering.
    // The scheduler only needs to determine whether each scenario, in
    // isolation, could be satisfied by the network. Unlike `resources`
    // (which describe this instance itself), these describe its descendants.
    message PossibleEnvironmentWorkload {
        // One group of identical concurrent descendant workloads.
        message Workload {
            // Identifies the service responsible for this workload. The
            // message may be omitted when the workload is resource-only.
            message Dependency {
                // Known content hashes for the dependency service.
                repeated Metadata.HashTag.Hash hash = 1;
                // Full or partial dependency specification.
                Service service = 2;
                // True when `service` is complete, so its hashes can be
                // calculated and verified against `hash`.
                bool is_completed = 3;
                // True when the complete dependency is stored in this
                // service's filesystem (for example, as a celaut.bee passed
                // later to the node's Execute method).
                bool on_filesystem = 4;
            }

            // Number of concurrent descendant instances that require `resources`.
            uint32 count = 1;
            // Resources each of those descendant instances may require.
            Sysresources resources = 2;
            // Dependency identity/specification, if this workload is tied to
            // a particular service. Message presence distinguishes an omitted
            // dependency from an explicitly populated one.
            Dependency dependency = 3;
        }
        repeated Workload workloads = 1;
    }

    message Container {
        
        message Architecture {
            repeated string tags = 1;
            string prose = 2;
            bytes formal = 3;
        }
        
        message Filesystem {
            message ItemBranch {
                message Link {
                    string src = 1;
                    string dst = 2;
                }
                // Identifier for the file or folder name.
                string name = 1;
                oneof item {
                    // Raw file bytes.
                    bytes file = 2;
                    // Symbolic link.
                    Link link = 3;
                    // Nested filesystem tree.
                    Filesystem filesystem = 4;
                }
                map<string, bytes> xattrs = 5;
            }
            repeated ItemBranch branch = 1;
        }
        
        message Init {
            repeated string entry_path = 1;
            map<string, bytes> xattrs = 2;
        }

        message ConfigDeclaration {
            repeated string path = 1;
            DataFormat format = 2;
        }

        message Resources {
            // Initial system requirements.
            Sysresources at_init = 1;

            // Maximum system requirements.
            Sysresources at_most = 2;
        }

        // CPU architecture and environment description.
        Architecture architecture = 1;
        
        // Serialized filesystem.
        bytes filesystem = 2;
        
        // Entrypoint and startup metadata for the container.
        Init init = 3;
        
        // Container resource 
        optional Resources resources = 4;

        ConfigDeclaration config_declaration = 5;
        
        // Expected node protocol stack for internal node logic.
        repeated Api.Protocol node_protocol_stack = 6;

        // Environment variables for the execution environment.
        // (Moved here from Service.Api: env vars belong to the container that
        // runs the code, not to the communication interface.)
        map<string, DataFormat> environment_variables = 7;

    }

    // A Network is a *logical communication domain* between service
    // instances. It only describes:
    //   - which peers the service wants to communicate with (tags/prose/formal);
    //   - which protocols those peers are expected to expose (protocol_stack).
    //
    // Shared disks / VirtioFS / filesystem inheritance are NOT networks.
    // Those are an execution-environment concern expressed through
    // Container.Filesystem.ItemBranch.xattrs (see shared/guest/access).
    message Network {
        repeated string tags = 1;
        string prose = 2;
        bytes formal = 3;

        // Protocol stack expected from the peers in this communication domain.
        repeated Api.Protocol protocol_stack = 4;

        // Name of an environment variable used to filter compatible peer
        // instances during ConfigurationFile.NetworkResolution. Only peers
        // whose value for this environment variable matches the requesting
        // instance's value are returned. Empty => no env-based filtering.
        //
        // Example: many PostgreSQL instances may exist on the network, but
        // only those sharing the same value of e.g. "PG_CLUSTER" are peers.
        string environment_variable = 5;
    }

    // Natural language description.
    string prose = 1;

    // Container configuration.
    Container container = 2;
    
    // API definition.
    Api api = 3;
    
    // Network definitions.
    repeated Network network = 4;

    // Worst-case descendant workload scenarios this service may request.
    // This belongs to the service-level execution environment rather than to
    // its container representation. Spec-only: nodo's scheduler interpretation
    // and validation are intentionally NOT part of this change (#163).
    repeated PossibleEnvironmentWorkload possible_environment_workload = 5;
}

message Instance {
    message Uri {
        string ip = 1;
        int32 port = 2;
    }
    message Uri_Slot {
        int32 internal_port = 1;
        repeated Uri uri = 2;
    }
    // API endpoints exposed by this instance.
    Service.Api api = 1;
    // Mapping of internal ports to external URIs.
    repeated Uri_Slot uri_slot = 2;
}

// -----------------------
// SERVICE INSTANCE CONFIGURATION
// -----------------------

message Configuration {
    // Environment variables for gateway services.
    map<string, bytes> environment_variables = 1;

    // Service specification slots.
    repeated int32 spec_slot = 2;

    // Optional initial MU balance for service execution.
    optional Amount initial_mu = 3;
}

message ConfigurationFile {
    message NetworkResolution {
        repeated string tags = 1;
        repeated Instance peer_instances = 2;
    }
    // Gateway instance settings.
    Instance gateway = 1;
    // Combined configuration options.
    Configuration config = 2;
    // Network discovery of peers.
    repeated NetworkResolution network_resolution = 3;
    // Initial system resource allocation for services.
    Sysresources initial_sysresources = 4;
}

// -----------------------
// SYSTEM RESOURCES
// Defines resource limits and weights for container updates.
// -----------------------

message Sysresources {
    // Block I/O weight (relative), 10–1000.
    optional uint64 blkio_weight = 1;
    // CFS CPU period in microseconds.
    optional uint64 cpu_period = 2;
    // CFS CPU quota in microseconds.
    optional uint64 cpu_quota = 3;
    // Memory limit in bytes.
    optional uint64 mem_limit = 4;
    // Disk space limit in bytes.
    optional uint64 disk_space = 5;
}

// -----------------------
// GATEWAY MESSAGES
// -----------------------

message TokenMessage {
    string token = 1;
    optional string slot = 2;
}

message EstimatedCost {
    Amount cost = 1;
    Amount init_maintenance_cost = 2;
    Amount max_maintenance_cost = 3;
    int32 maintenance_seconds_loop = 4;
    float variance = 5;
}

// Answer to "could you run an instance shaped like this right now?" — the
// same admission check a real StartService/GetServiceEstimatedCost request
// would run (see get_resource_availability), asked in isolation for a
// resource shape that may not correspond to any packed service on either
// side. Used to evaluate Service.PossibleEnvironmentWorkload scenarios: a
// descendant workload group can declare only `resources`, with no `hash`/
// embedded `service` to ask GetServiceEstimatedCost about.
message ResourceAvailability {
    bool can_execute = 1;
    // Empty when can_execute is true. Human-readable, not meant to be parsed.
    string reason = 2;
}

message Refund {
    Amount amount = 1;
}

message Payment {
    string deposit_token = 1;
    Contract contract = 2;
    Amount amount = 3;
}

message Metrics {
    Amount balance = 1;
}

message ServiceInstance {
    string token = 1;
    Instance instance = 2;
}

message Peer {
    // One address this peer is reachable at, fully self-describing: the transport
    // and protocol stack belong to the endpoint, not to the node, so no separate
    // slot message and no port-based matching between the two is needed.
    message Uri {
        // Deliberately not Service.Api.Protocol: a peer's endpoint is not a service
        // API declaration, and reusing that message coupled the two schemas for no
        // reason other than that the fields happened to line up.
        message Protocol {
            repeated string tags = 1;
            string prose = 2;
            bytes formal = 3;
        }

        string ip = 1;
        int32 port = 2;
        // Unix timestamp after which this address may stop being valid (e.g. a
        // typical ISP DHCP lease expiry). Optional: 0 means no estimate is made.
        // Lets a reader anticipate the change -- preferring a fresher announcement
        // or a DNS re-resolution -- instead of assuming a dynamic address stays
        // valid forever (issue #236, absorbing #235). Covered by `signature`, so
        // it cannot be stripped or extended in transit.
        int64 expiry_unix_timestamp = 3;
        // Transport this address speaks (tcp / udp). Per-address rather than
        // per-node: tcp:8080 and udp:9000 are different endpoints, and a reader
        // needs this to probe the address with the right kind of socket.
        Protocol transport = 4;
        repeated Protocol protocol_stack = 5;
    }

    repeated Contract reputation_proofs = 1;

    // Every address this peer is reachable at.
    repeated Uri uri = 2;

    // Node-wide, not per-address: what this peer accepts as payment and what it
    // charges on a recurring basis. A node's rates do not depend on which of its
    // addresses you reach it through (see cost_functions.node_advertised_rates,
    // which has no notion of a port), so they are not repeated per Uri.
    repeated ContractRate payment_contracts = 3;
    map<string, Amount> mu_per_call = 4;

    // Node identity (issue #236): the public key (hex) of the node's identity keypair,
    // in whatever encoding `signature_scheme` names, and a signature over the canonical
    // encoding of everything this message advertises -- see
    // node_identity.canonical_peer_payload.
    // Verifying it proves the sender controls public_key without any interactive
    // challenge, so GetPeerInfo alone is enough (SignPublicKey is removed). Both are
    // required: a Peer carrying neither, or whose signature does not verify, is refused
    // outright -- the public key IS the peer's id, so there is nothing else to register
    // it under (see manager.add_peer_instance).
    //
    // The identity is a keypair of the node's own, on no ledger. It is deliberately not
    // a wallet: a wallet key is bound to what its ledger can verify and spend, so an
    // identity that *was* one could never be anything else. The link to a ledger is an
    // owner attestation on each reputation proof (see reputation_proofs above), which
    // costs one signature and buys the node the right to change, add or drop a wallet
    // without changing its name.
    string public_key = 5;
    string signature = 6;


    // Which cryptography `public_key` and `signature` are in, declared rather than
    // assumed. A scheme is an open, unordered stack of building blocks (curve,
    // signature algorithm, ledger convention, challenge hash, ...) -- deliberately
    // not four named fields: a scheme with a different shape (hash-based, threshold,
    // ...) needs no proto migration to be expressed, only a different-length stack.
    // Each block uses the same shape every other replaceable component in celaut is
    // declared with (Uri.Protocol, Contract.Ledger, Container.Architecture): `tags`
    // name it, `prose` describes it to a reader, `formal` points at a machine-readable
    // specification when one exists. Without this field, secp256k1 + Ergo's Schnorr is
    // not a component at all but the hardcoded meaning of the two fields above, and a
    // peer signing with anything else is indistinguishable from a peer with a corrupt
    // signature.
    //
    // There is no id derived from the descriptor, here or anywhere else in celaut: a
    // hash algorithm can be named by H("") because hashing is unary and keyless, so
    // the algorithm itself yields a name nobody has to agree on, but verification
    // takes a key, a message and a signature and has no such canonical output. So the
    // descriptor IS the name, exactly as it is for a ledger or an architecture, and
    // whether two of them denote the same cryptography is decided by *comparing*
    // them -- loosely, since these definitions are deliberately loose. A service of
    // the shape (scheme_a, scheme_b) -> bool can eventually make that call better
    // than a node does on its own; node_identity.same_signature_scheme is the one
    // place it would be asked from.
    //
    // Declaring a scheme does NOT oblige a node to implement it, and this one
    // implements exactly one: it checks that the scheme a peer declares is the scheme
    // it speaks and refuses the announcement otherwise (manager.add_peer_instance).
    // That asymmetry is inherent, not a shortcut -- an unknown *hash* is inert (skip
    // it, another hash of the same object still verifies), while an unknown
    // *signature* is an authentication decision with no third answer: accepting one
    // unverified admits anyone. So a scheme needs no global consensus, but it does
    // need the peer reading it to speak it.
    //
    // An empty descriptor means the sender's default, so an announcement from a node
    // that predates this field still verifies.
    //
    // One scheme per Peer, and therefore one public_key: they are not repeated, and a
    // node signing under two schemes at once is not representable. That is a decision,
    // not an oversight. The public key IS the peer's id, so a second one is a second
    // identity -- it splits the node's reputation, its deposits and its payment
    // attribution in two, and the split cannot be healed by cross-signing the keys
    // because whoever needs the link speaks only one of the two schemes and can verify
    // only one half of it. It would also leave every later interaction asking which key
    // to authenticate with, and the TLS certificate of issue #257 -- whose extension is
    // signed by exactly this key -- wants one answer.
    //
    // Note what that argument does NOT extend to. A key in a *different role* is not a
    // second identity: a reputation proof's owner attestation names the wallet that
    // published it, and the TLS certificate carries a per-process P-256 key, both of
    // them tied to this one. That is a hierarchy with a single root, not two names --
    // nobody has to pick which one the node is. What must stay singular is the root.
    //
    // Reading a scheme is a different matter from signing with one, and stays open:
    // a node that must talk to peers signing differently plugs in a verifier for that
    // scheme rather than asking them to carry more keys. And a scheme that genuinely
    // needs two keypairs -- a classical/post-quantum hybrid, say -- is ONE scheme with
    // one descriptor whose encoding carries both, not two schemes on one Peer.
    //
    // Singular here and ONLY here. payment_contracts and reputation_proofs above are
    // repeated on purpose and stay that way: a node named by a key of its own, holding
    // wallets on several ledgers, accepting payment in ERG and in bitcoin, is the
    // expected shape. The asymmetry is what each field does. What a node accepts is a
    // menu the payer picks one item from, and what it can prove about a proof is a fact
    // per proof, so a longer list costs nothing; the identity is what NAMES the node,
    // and a second name is a second node as far as its reputation, its deposits and its
    // payment attribution are concerned.
    //
    // Covered by `signature` (node_identity.canonical_peer_content_digest). It has to
    // be: verification is a decision with no third answer, so a relay able to re-label
    // a signature as belonging to a different scheme -- one that also accepts those
    // bytes, or simply a weaker one -- would be rewriting an authentication decision in
    // transit. That a node implements one scheme today does not make the field safe to
    // leave out, because which schemes it accepts is a local capability that can change
    // without the wire format changing.
    //
    // `formal` is empty on every component of this node's own declaration, as it is
    // on the Ergo ledger (reputation_system/envs.py): there is no machine-readable
    // artifact to point at yet, and the tags carry the identity until there is one.
    message SignatureScheme {
        message Protocol {
            repeated string tags = 1;
            string prose = 2;
            bytes formal = 3;
        }
        // Two schemes match iff there is a one-to-one pairing between their
        // components where each pair matches on `formal`, or -- when neither side
        // of the pair has one -- carries exactly the same set of `tags`. Order
        // carries no meaning. Every component must declare `tags`, `formal` or
        // both: one holding only `prose` states nothing a comparison can act on.
        // See node_identity.same_signature_scheme.
        repeated Protocol components = 1;
    }
    SignatureScheme signature_scheme = 7;

    // Anti-replay: a verifier rejects a message whose ts is not strictly newer than
    // the last one it accepted for this public_key. Guards only against a downgrade
    // to a stale address; the claim itself is safe to freely redistribute.
    int64 ts = 8;
}

message Client {
    string client_id = 1;
}

message RecursionGuard {
    string token = 1;
}

message ModifyServiceSystemResourcesOutput {
    Sysresources sysreq = 1;
    Amount balance = 2;
}

message ModifyServiceSystemResourcesInput {
    Sysresources min_sysreq = 1;
    Sysresources max_sysreq = 2;
}

message ModifyDepositInput {
    Amount difference = 1;
    string service_token = 2;
}

message ModifyDepositOutput {
    bool success = 1;
    string message = 2;
}

// Observe: live instance observability stream (see src/commands/observe.py).
// Input: which instance to observe (id/token, as GetMetrics addresses it).
message ObserveRequest {
    string instance_id = 1;    // instance id / token (TokenMessage.token semantics).
    bool include_packets = 2;  // opt-in per-packet records; metrics snapshots are the baseline.
}

// One live observability event. ``kind`` names the populated payload so a
// consumer can switch without inspecting the oneof. Fields mirror what
// observe.py writes to metrics.jsonl (metrics) and serialize_event (packet).
message ObserveEvent {
    string time = 1;  // HH:MM:SS, matching metrics.jsonl timestamps.
    string kind = 2;  // "session" | "metrics" | "packet" | "notice".

    // Emitted once, first: how capture was resolved for this instance.
    message Session {
        string instance_id = 1;
        string tag = 2;
        string capture_mode = 3;     // "pcap" (AF_PACKET tap) | "conntrack" (fallback).
        string degraded_reason = 4;  // empty when full AF_PACKET capture is live.
        int32 link_type = 5;         // libpcap LINKTYPE for the global header (1=ethernet, 101=raw IP).
        uint32 snaplen = 6;          // capture snap length for the pcap global header.
        string balance = 7;          // instance MU balance at attach (celaut Amount numeric string); "" when unknown.
    }

    // One CPU+memory sample (the fields of observe.metrics_record).
    message Metrics {
        bool alive = 1;
        optional double cpu_percent = 2;
        optional double cpu_peak_percent = 3;
        optional uint64 mem_bytes = 4;
        optional uint64 mem_peak_bytes = 5;
        // Cumulative block-IO bytes for this instance: cgroup io.stat when
        // the io controller is delegated to the leaf, else the hypervisor
        // process's /proc/<pid>/io read_bytes/write_bytes.
        optional uint64 disk_read_bytes = 6;
        optional uint64 disk_write_bytes = 7;
        // Cumulative tap-interface counters. rx = frames the host received from
        // the VM (VM egress); tx = frames sent to the VM (VM ingress).
        optional uint64 net_rx_bytes = 8;
        optional uint64 net_tx_bytes = 9;
        optional uint64 net_rx_packets = 10;
        optional uint64 net_tx_packets = 11;
        // Instance MU balance at this sample (celaut Amount numeric string),
        // re-read each tick so a consumer sees it spent live. "" when unknown.
        string balance = 12;
    }

    // One parsed connection event (the fields of observe.serialize_event).
    message Packet {
        string direction = 1;           // "IN" | "OUT" (derived from the IP header).
        string transport = 2;           // tcp | udp | icmp ...
        string protocol = 3;            // display label (transport upper-cased).
        string tcp_flags = 4;
        string src = 5;                 // ip:port
        string dst = 6;                 // ip:port
        optional uint32 frame_len = 7;  // captured bytes (pcap path only).
        string peer_kind = 8;           // "instance" | "external".
        string peer_instance_id = 9;    // set when peer_kind == "instance".
        string peer_tag = 10;
        string peer_relationship = 11;  // parent | child | peer.
        string peer_host = 12;          // set when peer_kind == "external".
        string source = 13;             // "pcap" | "conntrack".
        // Verbatim captured frame + kernel receive time, so an include_packets
        // client can rebuild a byte-exact .pcap remotely. Only set in pcap mode
        // when include_packets is true (unset for conntrack / metrics-only).
        bytes raw_frame = 14;
        optional double frame_timestamp = 15;
    }

    // Degraded-mode / lifecycle message (never fabricated data).
    message Notice {
        string message = 1;
        bool degraded = 2;
    }

    oneof payload {
        Session session = 10;
        Metrics metrics = 11;
        Packet packet = 12;
        Notice notice = 13;
    }
}

// -----------------------
// GATEWAY SERVICE DEFINITION
// -----------------------

service Gateway {
    rpc StartService(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Configuration | Hash | Client | RecursionGuard | Service -> Instance
    rpc StopService(stream buffer.Buffer) returns (stream buffer.Buffer) {} // TokenMessage -> Refund
    rpc ModifyDeposit(stream buffer.Buffer) returns (stream buffer.Buffer) {} // ModifyDepositInput -> ModifyDepositOutput

    rpc GetPeerInfo(stream buffer.Buffer) returns (stream buffer.Buffer) {} //  -> Peer
    rpc IntroducePeer(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Peer -> 
    rpc GenerateClient(stream buffer.Buffer) returns (stream buffer.Buffer) {} //  -> Client
    rpc GenerateDepositToken(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Client -> TokenMessage
    rpc Payable(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Payment -> Empty
    rpc ModifyServiceSystemResources(stream buffer.Buffer) returns (stream buffer.Buffer) {} // ModifyServiceSystemResourcesInput -> ModifyServiceSystemResourcesOutput
    rpc GetServiceEstimatedCost(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Metadata.HashTag.Hash & Service -> EstimatedCost
    rpc GetResourceAvailability(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Service.Container.Resources -> ResourceAvailability
    rpc GetService(stream buffer.Buffer) returns (stream buffer.Buffer) {} // Metadata.HashTag.Hash -> Service
    rpc GetMetrics(stream buffer.Buffer) returns (stream buffer.Buffer) {} // TokenMessage -> Metrics
    rpc ServiceTunnel(stream buffer.Buffer) returns (stream buffer.Buffer) {} // TokenMessage | bytes -> bytes
    rpc Observe(stream buffer.Buffer) returns (stream buffer.Buffer) {} // ObserveRequest(instance_id/token) -> stream ObserveEvent
}
