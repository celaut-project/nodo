syntax = "proto3";
package celaut;

import "buffer.proto";

// -----------------------
// HOW TO COMMENT THIS FILE
//
// The leading comment of each message, field and RPC (the comment immediately above
// it, with no blank line between) is its protocol description. The node puts these
// descriptions in the prose of the celaut-gateway layer that it announces
// (src/identity/protocol_doc.py). Write them in ASD-STE100 Simplified Technical
// English. Say what the element is and what a sender and a receiver do with it. Do
// not refer to files of this implementation.
//
// A note for developers goes in a detached comment: a comment with a blank line
// between it and the element. The node does not announce detached comments.
//
// After a change to this file, run bash/generate_protos.sh. It also writes
// protos/celaut_doc.binpb, the descriptor with these comments.
// -----------------------

// -----------------------
// CEL•AUT MESSAGES
// -----------------------

// A description of a thing that this contract does not define: a format, a protocol, a
// ledger, an architecture, a signature scheme. It is the one form of each replaceable
// component. The tags name the thing for a reader. The prose explains it to an
// implementer. The formal defines it. Nodes compare two descriptors by the exact bytes
// of their formal fields, and never by their tags or their prose. A published formal
// never changes: a new meaning is a new formal. A descriptor with an empty formal names
// a thing and does not identify it: a reader can use it to look for the thing, and never
// to decide that two things are the same. Where a place of this contract lets a reader
// compare by tag, the place says so.
message Descriptor {
    // Names, for a reader.
    repeated string tags = 1;
    // The text, for an implementer.
    string prose = 2;
    // The definition. It is what nodes compare.
    bytes formal = 3;
}

// Ordered key/value entries, one message per value type.
//
// These replace protobuf `map<string, V>` fields. A proto3 map is wire-identical to
// `repeated Entry { key = 1; value = 2; }` at the same field number, so a field
// converted from a map keeps its number and name and still reads bytes written before
// the change -- and is read by nodes that still declare the map. What a map does NOT
// give is a defined order: protobuf leaves map entry order on the wire to the
// implementation, and a service id is a hash of the serialized specification, so two
// implementations (or two runs) could serialize the same service to different bytes and
// therefore different ids. A repeated field keeps the order it was given.
// (src/utils/keyvalue.py is the one place that implements the convention below.)

// One entry of a list of key-value entries, with a bytes value. In a list, a sender
// sorts the entries by key (UTF-8 bytes, ascending), writes one entry for each key and
// writes no empty key. A reader uses the last entry of a key. The value has explicit
// presence, so an entry with an empty value is still written.
message BytesKeyValue {
    // The key.
    string key = 1;
    // The value.
    optional bytes value = 2;
}

// An entry that a formal defines, with a value: a setting of a service, a condition or a
// promise of an offer, a fact that a node attests. It is a Descriptor plus the value.
// The formal of the entry is the formal of its descriptor. The formal defines what the
// entry means, the form of its value, the places where it is valid, and what an absent
// entry means. Nodes compare an entry by the exact bytes of its formal, and never by its
// tags or its prose. In one list, two entries do not have the same formal, and a sender
// sorts the list by formal (bytes, ascending). The order does not change the meaning. A
// reader refuses a list with a repeated formal. An entry with an empty formal is not
// valid. A value has exact numbers only: a ratio is two integers.
//
// The place of a list decides what a reader does with a formal that it does not know, or
// with a value that it does not understand. Each list says which of the two it is:
// - A requirement binds the reader. The reader refuses: a node does not run the service,
//   a caller does not accept the offer.
// - An announcement only informs the reader. The reader keeps the entry and does not use
//   it.
// Before a reader refuses or ignores an entry, it can look for a service that implements
// the formal. It uses such a service only if it trusts the binding of that service to
// that formal. Where the reader finds the binding is its own decision, not a part of
// this contract.
message Policy {
    // What the entry is. Its formal is what nodes compare, and it is not empty.
    Descriptor descriptor = 1;
    // The value of the entry. Its form is defined by the formal.
    bytes value = 2;
}

// One entry of a list of key-value entries, with a Descriptor value. The list follows
// the same rules as a list of BytesKeyValue.
message DescriptorKeyValue {
    // The key.
    string key = 1;
    // The value.
    Descriptor value = 2;
}

// Why the owner attestation of a reputation proof is in xattrs (owner_public_key,
// owner_signature) and not in the Peer:
//
// That pair is what attributes an on-chain fact to a peer without the peer's name
// having to be an on-chain object. A reputation proof on Ergo names its owner in R7,
// which is the reputation contract's spending clause (`INPUTS.exists {
// b.propositionBytes == SELF.R7[Coll[Byte]].get }`), so R7 can hold nothing but an Ergo
// proposition, ever. Reading it as the peer's id would therefore fix every celaut
// node's identity as an Ergo key by construction. With the attestation a reader checks
// two links instead -- R7 is the attested owner, and that owner signed this peer_id --
// which is the same fact, still verifiable from the proof box alone with no round-trip
// to the node (the box's R9 carries the whole signed Peer), and it holds for a second
// ledger's reputation system without either being privileged.
//
// It belongs to the proof and not to the Peer because ownership is a property of the
// proof: a node holds as many as it likes, and nothing says they share an owner. An
// attestation per ledger on the announcement could not describe two proofs on the same
// ledger published by different wallets. (src/utils/contract_xattrs.py has the keys.)

// A payment contract or a reputation proof on a ledger. The ledger gives the chain and
// its rules. The protocol gives the kind of payment contract on that ledger. The xattrs
// give the values of this contract.
//
// The formal field of the protocol of a payment contract defines the keys of xattrs of
// that contract: what they mean, how they are encoded and which of them are required.
// A reputation proof has no protocol. The formal field of its ledger defines its keys.
// They include the owner attestation: the key that published the proof, and its
// signature on a text that contains the id of the peer that announces the proof. The
// attestation proves only that the owner of the key accepts this peer as the holder of
// the proof. If the attestation is missing or does not verify, the reader does not
// credit the proof to the peer.
message Contract {
    // The ledger of the contract. Its formal gives the network, the units and the rules.
    Descriptor ledger = 1;
    // The kind of payment contract on the ledger. A ledger can have more than one kind
    // of contract. Its formal defines the keys of xattrs and the way to pay. A node that
    // does not know the formal cannot pay to the contract, and it does not use the
    // contract. A payment contract has a protocol with a formal that is not empty. A
    // reputation proof does not have one.
    Descriptor protocol = 2;
    // The values of this contract. The formal field of the protocol defines the keys. On
    // a reputation proof, the formal field of the ledger defines them.
    repeated BytesKeyValue xattrs = 3;
}

// Why a string and not an integer: a balance has no limit. Ergo defaults to 1 MU = 1
// nanoERG (ledgers.ergo.payments.MU_PER_NANOERG), but the operator can change that
// default. It is not a definition.

// An amount in MU, the monetary unit of the node that issues it. MU has no value of its
// own. Each payment contract gives the value of MU (ContractRate.mu_per_unit), so a
// reader can convert a price. Do not assume a fixed rate.
message Amount {
    // A decimal integer, with a minus sign if it is negative. Most fields have a value
    // of 0 or more. ModifyDepositInput.difference can be negative. A balance can be
    // negative if the node allows debt.
    string n = 1;
}

// This is what lets a node be paid in something other than ERG without giving up a
// common scale: ERG is simply the contract whose rate is the peg (1 MU per nanoERG by
// default), and another ledger declares its own.

// A payment contract and the value of its asset in MU.
message ContractRate {
    // The contract that a payer pays into.
    Contract contract = 1;
    // The MU for one base unit of the asset: one nanoERG, one satoshi, or one smallest
    // unit of a token. It is not the MU for one whole ERG or BTC. The value is an
    // integer. The ledger declaration of the contract can give the same rule
    // (payment.rate.unit).
    Amount mu_per_unit = 2;
}

// One hash of an object: a service, an account, a chain of events, an execution. The
// type says the algorithm, so the contract never names one.
message Hash {
    // The type of the hash: the digest of an empty input with that algorithm and output
    // length. The value has the same length.
    bytes type = 1;
    // The digest of the object.
    bytes value = 2;
}

// -----------------------
// SERVICE SPECIFICATION
// Defines how a service is described: API, container, network.
// -----------------------

// The specification of a service: its container, its API, its networks and the
// workloads that it can start. The hash of the serialized Service is the id of the
// service. The Service holds its own schema (field 1), so the id covers what the bytes
// mean and not only the bytes. Field 1 is the schema in every variant of this contract.
//
// A Service is a requirement. A node that runs a service refuses a service with a field
// number that it does not know, at any level of the message. A node that only stores or
// forwards a Service keeps all its bytes, also the fields that it does not know, so the
// id of the service does not change.
message Service {
    // The interface of the service: its ports, what each port speaks, and what the
    // service charges its callers.
    message Api {
        // One port of the service and what it speaks.
        message Slot {
            // The port inside the container.
            uint32 port = 1;
            // What the port speaks: a tree of layers, as in Uri.layers.
            repeated Layer layers = 2;
            // The settings of the slot: a list of Policy in a requirement. A node that
            // does not know a setting, or does not understand its value, does not run
            // the service. A slot that does not set a setting has the default that the
            // formal of that setting gives.
            repeated Policy policies = 3;
            // What the service charges a caller for the use of the slot. The formal of
            // each rate says what is charged, for example each call, each byte or a
            // subscription. The scope is the name of a method. This list is for the
            // callers of the service: a node does not read it and does not charge it.
            repeated Rate rates = 4;
        }

        // The ports of the service.
        repeated Slot slot = 1;
        // The payment contracts that the service accepts as payment for its own API, and
        // the value of each in MU. This list is for the callers of the service: a node
        // does not read it.
        repeated ContractRate payment_contracts = 2;
    }

    // The descendants of the service: the instances that it starts while it runs. A
    // declaration is in conjunctive normal form over groups. It is an AND of clauses, a
    // clause is an OR of groups, and a group is an AND of workloads that run at the same
    // time. Unlike `container.resources` (which describe this instance), these describe
    // its descendants.

    // One group of identical instances that run at the same time.
    message Workload {
        // The service of the workload.
        message Dependency {
            // Known content hashes of the service, one for each hash type. They name
            // the service of the workload. A dependency with no hash names no service:
            // the workload accepts any service that agrees with the service field.
            repeated Hash hash = 1;
            // The full or a partial specification of the service. The resources of the
            // workload are in service.container.resources: at_init for the start,
            // at_most for the limit, and benchmarks for the minimum scores. A partial
            // service can have only the resources, the architecture and the devices.
            // The service is complete only if its hash, with the algorithm of a type in
            // the hash field, is equal to the value of that type. A reader that knows
            // none of these types reads the service as partial.
            Service service = 2;
            // Where a party can get the full service: a list of Policy in an
            // announcement. The formal of each entry defines a kind of source, and the
            // value gives the location. For example: a file in the filesystem of this
            // service, or a registry. A node that does not know a source ignores it,
            // and it can get the service from a source that is not in the list. A
            // source never changes the service that the hash field names.
            repeated Policy sources = 3;
        }

        // The number of instances that run at the same time.
        uint32 count = 1;
        // The service of the instances: a hash, a service, or both. A workload with no
        // resources in its service is always satisfiable.
        Dependency dependency = 2;
    }

    // AND: all the workloads of the group run at the same time.
    message Group {
        // The workloads of the group.
        repeated Workload workloads = 1;
    }

    // OR: one group of the clause is sufficient. The service chooses the group at run
    // time.
    message Clause {
        // The groups of the clause.
        repeated Group any_of = 1;
    }

    // What the node runs: the architecture, the filesystem, the entry point and the
    // resources.
    message Container {
        // A tree of files and directories.
        message Filesystem {
            // One file, symbolic link or directory in a tree.
            message ItemBranch {
                // A symbolic link.
                message Link {
                    // The fully resolved target of the link. If the target is in the
                    // image, it is an absolute path from the root of the image.
                    string src = 1;
                    // The full path of the link from the root of the image. It is the
                    // same as the path of this entry.
                    string dst = 2;
                }
                // The name of the file, the link or the directory.
                string name = 1;
                oneof item {
                    // The content of a file, or a buffer.Block that points to the
                    // content. Empty for a device file.
                    bytes file = 2;
                    // A symbolic link.
                    Link link = 3;
                    // The content of a directory.
                    Filesystem filesystem = 4;
                }
                // The values of the entry. A policy of the root Filesystem defines the
                // keys. Without such a policy, a node reads nothing from here.
                repeated BytesKeyValue xattrs = 5;
                // Settings of the entry: a list of Policy in a requirement. A node that
                // does not know a policy, or finds it in a place that its formal does
                // not allow, does not run the service.
                repeated Policy policies = 6;
            }
            // The entries of the directory.
            repeated ItemBranch branch = 1;
            // Settings of the whole tree: a list of Policy in a requirement. Only on the
            // root Filesystem (the one that Container.filesystem holds): a subdirectory
            // has none. A node that does not know a policy does not run the service.
            repeated Policy policies = 2;
        }

        // How the node starts the service.
        message Init {
            // The path of the executable, as path segments. No arguments.
            repeated string entry_path = 1;
            // Settings of the start: a list of Policy in a requirement. A node that does
            // not know a policy does not run the service. The settings of this place say
            // how the node starts a process of the service, how it continues one on a
            // state that it kept, where the service reads the notices of the node, and
            // the guest kernel that the instance boots. The guest kernel is one setting
            // for the instance and all its devices. With no guest kernel setting, the
            // service has no preference, and the node selects the kernel.
            repeated Policy policies = 2;
        }

        // The resources of one instance of the service, and the scores that it needs.
        // Each list follows the rules of a list of Quantity. A formal of a resource is
        // valid only in at_init and at_most, and a formal of a benchmark only in
        // benchmarks. A node refuses a formal in the wrong list.
        message Resources {
            // The resources that the instance needs at the start. A resource that is
            // not in the list is 0 at the start.
            repeated Quantity at_init = 1;
            // The most that the instance can grow to. A resource that is not in the list
            // cannot grow above its value in at_init. For each formal, the value in
            // at_init is not more than the value in at_most. If it is, the service is
            // not valid.
            repeated Quantity at_most = 2;
            // The minimum scores that the instance needs. A score does not have a start
            // value and a maximum: the node meets it or does not. The node compares the
            // scores each time that it places the instance: at the start, when it wakes
            // the instance, and when it moves it. It makes no promise between two
            // placements. A score that must be stable is a formal of a percentile (for
            // example the 5th percentile over windows of one second), not a separate
            // number.
            repeated Quantity benchmarks = 3;
        }

        // The architecture that the container needs. A container with no architecture
        // is not valid: an empty architecture never means the native architecture of
        // the node.
        Descriptor architecture = 1;
        // The filesystem of the container: a serialized Filesystem, or a buffer.Block
        // that points to it.
        bytes filesystem = 2;
        // How the node starts the service.
        Init init = 3;
        // The resources of one instance.
        optional Resources resources = 4;
        // What the service uses of the node: a path, the protocols that it speaks to the
        // gateway of the node, bottom to top. The node finds it in the tree of its own
        // address (see Layer). The service declares only the RPCs of the gateway that it
        // uses, as a small formal. Here the node reads the formals: it accepts the
        // gateway layer of the path if it is a subset of its own gateway layer. It does not declare the full layer of the
        // node, so the id of a service does not change with each release of a node. An
        // empty list declares that the service uses no RPC of the node: it does not
        // change its own resources and does not start dependencies. A node that does not
        // speak a protocol of the list does not run the service.
        repeated Descriptor node_protocol_stack = 5;
        // The environment variables that the service declares, each with its format. A
        // caller gives the values in Configuration.environment_variables.
        repeated DescriptorKeyValue environment_variables = 6;
        // The devices that the node gives to the instance (see Device). Repeat the entry
        // for each device that the service needs, so the list can have two equal
        // entries. The order of the list has a meaning: the position of an entry, from
        // 0, is its number (DeviceChange.Attach.entry, AttachedDevice.entry). A reader
        // does not sort the list. A node that has no free device for an entry that it
        // attaches at the start refuses to start the service.
        repeated Device devices = 7;
    }

    // Shared disks / VirtioFS / filesystem inheritance are NOT networks. Those are an
    // execution-environment concern expressed through the policies of Container.Filesystem
    // (the setting "share").

    // A logical domain where the instances of the service find their peers. It gives
    // which peers the service wants (domain) and which protocols these peers must speak
    // (protocol_stack).
    message Network {
        // The domain: a requirement. Its formal defines a kind of domain: what a member
        // is, how a node finds the members, and which addresses the instance can reach.
        // Its value gives the parameters of the domain, in the form that the formal
        // defines. For example: a host name and its ports, or the identity of a database
        // that instances share. Two domains are the same only if their formals have the
        // same bytes and their values have the same bytes, after the node applies the
        // settings of the network. The tags and the prose are for a reader: a node never
        // compares two domains by them. A node that does not know the formal does not run
        // the service.
        Policy domain = 1;
        // The protocols that the peers in the domain must speak.
        repeated Descriptor protocol_stack = 2;
        // Settings of the network: a list of Policy in a requirement. A node that does not
        // know a setting does not run the service. A setting can change the value of the
        // domain at the start of an instance, for example with the values of
        // Configuration.environment_variables. The id of the service keeps the value as
        // the service declares it.
        repeated Policy policies = 3;
    }

    // The schema of this message: a requirement. Its formal is the schema of the
    // contract for Service and for the messages that it contains. Its tags give the
    // full name of the type, for example "celaut.Service". A reader reads this field
    // first. It reads the other fields only if it knows the formal, or if it reads the
    // formal and decides that the two schemas agree. Otherwise it does not run the
    // service and gives the formal in the error. The formal is not empty. A Service that
    // a Dependency holds has its own schema too.
    Descriptor schema = 1;
    // A text that explains the service to a reader.
    string prose = 2;
    // The container of the service.
    Container container = 3;
    // The interface of the service.
    Api api = 4;
    // The domains where the instances of the service find their peers.
    repeated Network network = 5;
    // The load that the service can ask for later, while it runs. Each clause must fit
    // on the node or on a peer that it knows. If not, the node can refuse to start the
    // service. It is in the admission only. It has no cost.
    repeated Clause possible_environment_workload = 6;
    // The load that the service needs to start. It is in the admission, as
    // possible_environment_workload, and in the cost: EstimatedCost.cost includes the
    // builds of these children. Each child gets its balance in its own start.
    repeated Clause initial_environment_workload = 7;
}

// The life of an instance.
//
// An instance is a process that the node runs on the container of a service. It has
// two states, and no other: it runs (there is a process), or it is hibernated (there
// is no process). Both states are elemental. Other ways to stop and continue are not
// new states: they are policies of hibernation, with their own causes and costs.
//
// A hibernated instance keeps its identity: its token, its addresses and ports, its
// account and its balance. It also keeps its state: the filesystem of its container
// as the process left it. It has no process, and the node reserves none of its
// resources. Its resources keep their values: they are what the node gives to the
// instance when it wakes. Where the node keeps the state is its own decision.
//
// A hibernated instance has no devices: the node detaches all of them. Before the node
// detaches a device by its own decision (a hibernation or a stop that the instance did
// not ask for), it gives the notice that the settings of the device ask for. When the
// instance wakes, the node attaches again the entries of Container.devices that it
// attaches at the start, with the resources that they had. They can be other devices,
// with new ids, but not for an entry where the caller selected a device
// (Configuration.policies): the node gives that same device again, or the instance
// stays hibernated and the answer says why. The node does not attach again a device of
// an entry with a setting to attach on request: the new process asks for it.
//
// If a device fails or the node loses it, the node detaches it and stops its charge.
// InstanceState no longer shows it. The instance can ask for the entry again
// (DeviceChange.Attach).
//
// To wake an instance is to start a new process on the state that the node kept. By
// default, the new process starts from the entrypoint of the service. A service that
// needs another way to continue declares it with a policy in Container.Init. A node
// that does not know that policy refuses the service. The node places the instance
// again: it checks its capacity and the benchmarks of the service. If it cannot, the
// instance stays hibernated, and the answer says why. A wake starts a new process, so
// it has a StartReceipt. The statement of the account of the instance gives it
// (BalanceStatement.receipts), also for a wake that no caller asked for.
//
// An instance hibernates when its parent asks (ModifyServiceSystemResources), when its
// balance cannot pay the next maintenance period, or when a condition of the offer
// that the caller accepted says so (EstimatedCost.conditions). It wakes when its parent
// asks, when a deposit pays a maintenance period, or when a condition of the offer or a
// policy of the service says so. A node that cannot hibernate an instance refuses the request and
// gives the reason.
//
// The node charges a hibernated instance for the state that it keeps, at a Rate of
// Peer.rates. The formal of that rate defines the base of the charge, for example the
// size of the kept state. How long the node keeps a hibernated instance that cannot
// pay is a promise of the offer (EstimatedCost.promises). With no such promise, the
// caller assumes none: the node can stop the instance.

// One protocol that an address speaks, and the protocols that it carries. The layers of
// an address make a tree. Its roots are the transports of the port (for example tcp and
// udp on the same port number). Under a layer are the protocols that it can carry.
//
// A layer has more than one child only if its protocol can tell them apart (for
// example TLS by ALPN, or gRPC by the path of the service). The formal of each child
// includes the value by which its parent selects it.
//
// For example, the gRPC layer of a node has these children: the bee-rpc layer, with the
// layer celaut-gateway over it, and normal gRPC services of optional protocols (for
// example celaut-chat and celaut-observe, in protos/extensions/).
//
// By default, a party compares two layers by the exact bytes of their formal. A
// published layer never changes. A new version of a protocol, or a variant of it, is a
// new formal: a node announces it as a sibling of the old one, and keeps the old one
// while its callers need it. A caller looks for its own path, from a root and from child
// to child, with a compatible layer at each step. If no path of the tree matches its
// path, the caller does not call the address.
//
// A party can also read two formals and decide that they are compatible, for example
// when one is a subset of the other. That is a decision of that party, not of the
// contract, and that party carries its risk. Two nodes compare their layers by the exact
// bytes, and a node uses the sibling layers for its versions.
//
// The children of a layer follow the rules of a list of formals: no two with the same
// formal, sorted by formal. A reader can refuse a tree that is deeper or larger than its
// own limit.
message Layer {
    // The protocol of this layer.
    Descriptor protocol = 1;
    // The protocols that this layer carries. Empty for the top of a path.
    repeated Layer above = 2;
}

// One address: of a node, or of a port of an instance. It gives what it speaks, so each
// address describes itself. One address is one point of the network: an ip and a port.
// An address does not repeat itself to announce more protocols: they are branches of
// its tree.
message Uri {
    // The IP address or the host name.
    string ip = 1;
    // The port.
    uint32 port = 2;
    // The unix time, in seconds, after which the address can become incorrect. 0 means
    // no estimate.
    uint64 expiry_unix_timestamp = 3;
    // What the address speaks: the roots of its tree of layers, one for each transport.
    // In an address of an instance the list can be empty: Service.Api gives what the
    // port speaks.
    repeated Layer layers = 4;
}

// A running instance of a service, as a caller can reach it.
message Instance {
    // The addresses of one port of the instance.
    message Uri_Slot {
        // The port inside the instance. It is one of the ports of Service.Api.
        uint32 internal_port = 1;
        // The addresses where a caller can reach that port. Empty if the node cannot
        // give an address. Then the caller uses ServiceTunnel.
        repeated Uri uri = 2;
    }
    // The interface of the service.
    Service.Api api = 1;
    // The addresses of each port of the instance.
    repeated Uri_Slot uri_slot = 2;
}

// -----------------------
// SERVICE INSTANCE CONFIGURATION
// -----------------------

// The configuration that a caller gives to start a service.
message Configuration {
    // Values of the environment variables of the service. The key is the name of the
    // variable. The value is bytes, usually UTF-8 text. The node also gives a variable
    // to the process of the service, if its name is a C identifier. Its value must have
    // no NUL byte.
    repeated BytesKeyValue environment_variables = 1;
    // The most that the start can cost the caller, in MU. The node charges all of it to
    // the caller, and only this: no node charges the build of the service to the account
    // of the caller. The node takes the cost of the build from this amount. What is left
    // is the balance of the new instance, and the caller gets back what the instance
    // does not spend. If the build does not fit in the amount, or if the balance that
    // is left is less than what the conditions of the offer need, the node rejects the
    // start and charges nothing. If it is absent or zero, the node uses
    // EstimatedCost.cost plus a default balance that it calculates.
    optional Amount initial_mu = 2;
    // Settings of the start, from the caller: a list of Policy in a requirement. A node
    // that does not know a setting, or does not understand its value, refuses the start.
    // For example: the name that the caller gives to the instance, or the device that
    // the node gives for an entry of Container.devices, by the stable id that the node
    // announces (ArchitectureResources.facts).
    repeated Policy policies = 3;
    // The offer that the caller accepts for this start: the Signed EstimatedCost of the
    // same node, as the node sent it. If the offer is valid for this start, the node
    // keeps its conditions and its promises. The offer is valid if the node signed it,
    // its valid_until is not past, and it is an offer for this service and these
    // resources. In all other cases the node ignores the offer and prices the start at
    // its price of now. An absent offer has the same effect.
    optional Signed offer = 4;
}

// What the node gives to an instance when it starts it. The node writes it, serialized,
// to the file "/__config__" in the root of the instance. The path is the same for all
// services: a service does not declare it.
message ConfigurationFile {
    // The peers of one network of the service.
    message NetworkResolution {
        // The network, with the same bytes as in the Service of the instance.
        Service.Network network = 1;
        // The peers in the network that the instance can reach, each with only the
        // ports that match the network. The node lets the instance connect to these
        // peers, and to the other addresses that the formal of the domain allows.
        repeated Instance peer_instances = 2;
    }
    // The gateway of the node, as the instance can reach it. The instance asks the
    // gateway for the Peer of the node (GetPeerInfo) to learn its rates, its conditions
    // and its promises.
    Instance gateway = 1;
    // The Configuration of the start.
    Configuration config = 2;
    // The peers of each network that the node resolved at the start. A network that
    // the node did not resolve is not here.
    repeated NetworkResolution network_resolution = 3;
    // The resources that the node gave to the instance at the start, as a list of
    // Quantity, with only formals of resources.
    repeated Quantity initial_resources = 4;
    // The devices that the node attached to the instance at the start, each with its id
    // and its address in the guest. Empty if the instance has no devices. A device
    // that the node attaches after the start is not here: the answer of
    // ModifyServiceSystemResources gives it.
    repeated AttachedDevice devices = 5;
}

// -----------------------
// SYSTEM RESOURCES
// Resource limits, requirements and measured scores.
// -----------------------

// Two levels: this contract is static and hard to change. Above it are the formal
// definitions (policies, resources, benchmarks, rates, limits, architectures, APIs,
// protocols), that nodes can share, negotiate or ignore. A formal is a set of bytes that
// a document defines. A new thing is a new formal, never a new field, so this contract
// does not change when a new thing appears. (protos/REASON.md has the rules to reason
// about this contract.)

// A quantity of a thing that a node measures, gives or asks for. It is a Descriptor plus
// a number, as a Policy is a Descriptor plus a value. The formal of the quantity is the
// formal of its descriptor. The formal defines what the quantity is: the thing, its
// unit, if it is per core or total, and how a node measures it. The descriptor files
// are in protos/descriptors/ (protos/descriptors/REASON.md).
//
// There are two classes of formal, and the class is part of the definition of the
// formal. A list that holds quantities says which class it takes:
// - A resource is consumed. A node reserves it for the instance, adds the resources of
//   all its instances and keeps the sum within its capacity, enforces it (for example
//   with cgroups), and charges for it (Peer.rates). Examples: memory, disk, CPU quota.
// - A benchmark is not consumed. It is a score that the node measures. A node compares
//   the score with the minimum of each service on its own, and never adds scores. A
//   benchmark is not enforced, is not charged, and has no sense as a maximum. Examples:
//   integer operations per second of one core, bandwidth of the memory. Each formal
//   gives a statistic of the measures: a mean, or a percentile for a score that must be
//   stable.
// A node refuses a formal in a list of the wrong class.
//
// Nodes compare a quantity by the exact bytes of its formal, and never by its tags or
// its prose. One rule of comparison is for all the formals: more is better. A node
// offers enough if its value is greater than or equal to the value that is asked for.
// A thing that is better when it is less (a latency) is a rate (operations per second).
// In one list, two quantities do not have the same formal, and a sender sorts the list
// by formal (bytes, ascending). The order does not change the meaning. A quantity with
// an empty formal is not valid. A quantity without a value says nothing. It is not 0.
//
// What a node does with a formal that it does not know depends on the place:
// - In a requirement or a limit (Container.Resources, Device.resources, a
//   ModifyServiceSystemResources request, a GetResourceAvailability request), the node
//   refuses. It does not run the service. In a GetResourceAvailability answer, it
//   says can_execute false and gives the reason.
// - In an announcement (Peer.resources, Peer.devices), the node keeps the quantity and
//   does not use it. A node never refuses a peer because the peer measures a thing that
//   the node does not know.
message Quantity {
    // What the quantity is. Its formal is what nodes compare, and it is not empty.
    Descriptor descriptor = 1;
    // The number, in the unit that the formal defines. It has explicit presence, so a
    // value 0 is still written.
    optional uint64 value = 2;
}

// What a party charges for one thing: a node for a resource that it reserves or an
// action that it does (Peer.rates), or a service for the use of a slot
// (Service.Api.Slot.rates). The formal names the thing and gives the unit of the price.
// The rules of Quantity for the formal apply. A sender does not send a rate of 0. A list
// of rates is an announcement: a reader keeps a rate that it does not know, and does
// not use it. In one list, two rates do not have the same formal and scope. A sender
// sorts the list by formal, then by scope (bytes, ascending).
message Rate {
    // The thing that is priced and its unit. Its formal is what nodes compare.
    Descriptor descriptor = 1;
    // The price, in MU, in the unit of the formal.
    Amount value = 2;
    // Where the rate applies, for a formal that has a scope. The formal defines the
    // bytes of the scope and what they name. Nodes compare a scope by its exact bytes.
    // An empty scope is the general rate. A rate with a scope replaces the general rate
    // for that scope.
    bytes scope = 3;
}

// What a node limits: a supply that is not the capacity of the node. The formal names
// the limit and gives its unit. The rules of Quantity for the formal apply. A list of
// limits is an announcement. A limit that is absent is not a promise of no limit: the
// conditions and the promises of the offer (EstimatedCost) are the authority for one
// instance. In one list, two limits do not have the same formal and scope. A sender
// sorts the list as a list of Rate.
message Limit {
    // The limit and its unit. Its formal is what nodes compare.
    Descriptor descriptor = 1;
    // The number, in the unit of the formal.
    optional uint64 value = 2;
    // Where the limit applies, as in Rate.scope. An empty scope is the general limit.
    bytes scope = 3;
}

// -----------------------
// GATEWAY MESSAGES
// -----------------------

// A token.
message TokenMessage {
    // The token. In StopService and GetMetrics: an instance token. In the response of
    // GenerateDepositToken: a new deposit token.
    string token = 1;
}

// The first message of a ServiceTunnel: the instance and the port to reach. The instance
// is the instance of token, or a descendant of it. The node finds a descendant through
// the child_bound movements of the chains below the instance of token, as
// GetBalanceStatement does with instance_ref. The caller needs no token of the
// descendant, and the node gives no token. The descendant can be on another node. Then
// the node relays the bytes to that node, one hop at a time, each hop with the token
// that the node holds there. The descendant pays the traffic on the node that runs it.
message TunnelRequest {
    // The token of an instance that the caller holds. For a tunnel to a descendant, it
    // can be the token of an instance that stopped, while the node keeps its row.
    string token = 1;
    // The descendant, by its instance_ref (BalanceMovement.instance_ref). Absent for the
    // instance of token.
    Hash instance_ref = 2;
    // The internal port, as a decimal number. It must be one of the
    // Instance.uri_slot.internal_port values of the instance of the tunnel.
    string slot = 3;
    // True to also get the checkpoints of the stream, as Signed TunnelCheckpoint. For a
    // descendant, they name the execution by the instance_ref.
    bool receipts = 4;
    // How many nodes the tunnel can still go into, with the receiver. A node that relays
    // to the next node sends one less. A node that must first find which of its peers
    // holds the descendant shares one less between them, in equal parts. A receiver that
    // gets 0 refuses. A receiver that gets 1 relays to no other node. If it is absent,
    // the receiver uses its own maximum. A value above that maximum becomes the maximum.
    optional uint32 remaining_hops = 5;
}

// The offer of a node to run a service: the cost, and the terms that the node keeps.
// The node that answers sets it and signs it (Signed). The four amounts let a caller
// compare the offers of two nodes with no knowledge of their terms.
//
// The terms of the offer are in two lists of Policy: the conditions bind the caller,
// and the promises bind the node. The test for a term is this: if the caller is better
// off when the term is absent, the term is a condition. If the caller is equal or worse
// off when the term is absent, the term is a promise. The node writes the conditions
// and the promises of the offer that it keeps in the start movement of the instance, so
// a caller can show them against the node.
message EstimatedCost {
    // The cost that the start spends, in MU. It is the cost to build the service, plus
    // the cost to build its initial children. It does not include a balance, for the
    // service or for its children. If the service is already built, its build cost is
    // 0. The node takes the cost of the builds from Configuration.initial_mu, and the
    // remainder is the balance of the instance.
    //
    // The initial children are the children of Service.initial_environment_workload.
    // For each workload: count times the cost to build the child. The cost of a group is
    // the sum of its workloads, the cost of a clause is the highest cost of its groups,
    // and the total is the sum of the clauses. Each child gets its balance in its own
    // StartService. The parent pays that start from its own balance.
    Amount cost = 1;
    // The cost of one maintenance period with the resources at_init, in MU, at the time
    // of the offer. A promise of the offer can limit the cost of a later period. With
    // no such promise, the cost of a later period can be higher.
    Amount init_maintenance_cost = 2;
    // The cost of one maintenance period with the resources at_most, in MU, at the time
    // of the offer. It is not a limit on the charge of a period.
    Amount max_maintenance_cost = 3;
    // The length of one maintenance period, in seconds.
    uint32 maintenance_seconds_loop = 4;
    // The unix time, in seconds, until which the node keeps this offer for a start. A
    // caller that sends the offer in Configuration.offer before this time gets an
    // instance with the costs, the conditions and the promises of the offer. 0 means
    // that the node makes no promise for the start.
    uint64 valid_until = 5;
    // The conditions of the offer: a list of Policy in a requirement for the caller. A
    // condition binds the caller. For example: what the node does with the instance
    // when its activity window closes, the schedule of the node, a new kind of charge,
    // a limit of one instance. A caller that does not know a condition, or does not
    // understand its value, does not accept the offer.
    repeated Policy conditions = 6;
    // The promises of the offer: a list of Policy in an announcement for the caller. A
    // promise binds the node. For example: a limit on the growth of the maintenance
    // price, the maximum scarcity multiplier, how long the node keeps a hibernated
    // instance that cannot pay, a notice period before a stop. A caller that does not
    // know a promise ignores it. A promise never reduces what the caller gets. If the
    // node applies a promise against the caller, the signed offer is evidence against
    // the node. A promise that is not in the list is not made.
    repeated Policy promises = 7;
}

// Peers use this message to evaluate the Service.Workload entries of a service: a descendant workload
// can declare only resources, with no `hash`/complete `service` to ask
// GetServiceEstimatedCost about. Resources differ per architecture -- most visibly
// its benchmarks, since the same "1.0 core" is native silicon under one virtualizer and
// software emulation under another (#448).

// A device of the node that the node gives to one instance at a time: the node gives
// the access and takes it back, and it charges for the device. The way from the device
// to the guest does not matter: PCI, USB, a bus of a board, or a network of the node
// (for example a camera on a private segment that the node opens only to the
// instance). A thing that the instance reaches through a network, and whose access the
// node does not control (for example a camera on the internet), is not a Device: the
// service declares it as a Network. One Device is one device as the guest sees it: a
// physical device, or a part of one (for example a virtual function or a partition of
// a GPU). A service that needs two devices has two Device entries.
message Device {
    // The architecture of the device: what the software of the service programs
    // against, as for the architecture of the container. Its formal fixes the
    // granularity: for example a family of GPUs with one compute capability, a USB
    // video class camera, or one model of robot arm. A model that the software does not
    // need is not part of it: it is a fact of the device (ArchitectureResources.facts),
    // and a rate of a device can use it as its scope (Rate.scope). What the service
    // needs to drive the device (for example the guest kernel) is not part of it
    // either: it is a setting of the start, in Container.Init.policies. A device of a
    // node matches the entry when the two architectures have the same formal. A
    // service that must run on more than one architecture is a set of services, one
    // for each architecture. A Device with no architecture is not valid.
    Descriptor architecture = 1;
    // The resources that the service needs from the device, with the same meaning as in
    // Container.resources, but with formals of devices. A node refuses a formal that
    // its definition does not allow for a device.
    Service.Container.Resources resources = 2;
    // Settings of the device: a list of Policy in a requirement. For example: when the
    // node attaches the device, the notice that the service needs before the node
    // detaches it, or the other entries of Container.devices that the device must be
    // linked to, by their positions. With no setting, the node attaches the device before
    // the instance starts, and the instance has it until it stops or hibernates. A node
    // that does not know a setting refuses to start the service.
    repeated Policy policies = 3;
}

// The resources and the scores of one architecture, as a node announces or reports
// them. In Peer.resources and Peer.devices: the most that the node supports for that
// architecture, and the scores that it measured. In AttachedDevice: what the node gave
// to the instance. Each list follows the rules of a list of Quantity.
message ArchitectureResources {
    // The architecture.
    Descriptor architecture = 1;
    // The resources, as Quantity with formals of resources.
    repeated Quantity resources = 2;
    // The scores, as Quantity with formals of benchmarks. If the node did not measure a
    // score, the score is absent, never 0.
    repeated Quantity benchmarks = 3;
    // Other facts of the machine or of the device: a list of Policy in an
    // announcement. For example: the model, a stable id that a caller can select
    // (Configuration.policies), where the device is, or the devices that it is linked
    // to. A reader keeps a fact that it does not know.
    repeated Policy facts = 4;
}

// The answer of GetResourceAvailability.
message ResourceAvailability {
    // True if the node can run one instance of the container now.
    bool can_execute = 1;
    // Why the node cannot. Empty if can_execute is true. For a person: do not parse it.
    string reason = 2;
    // The unix time, in seconds, after which the answer can be different, if the node
    // knows it: for example the next time at which the node takes new work. 0 if the
    // node gives no time.
    uint64 opens_at = 3;
    // The descriptors of the request whose formals the node does not know, as the
    // request gave them, so the tags and the prose help the caller to look. Empty if
    // the node knows all of them. A caller can then ask a node that knows them, or look
    // for a service that implements them.
    repeated Descriptor unknown_formals = 4;
}

// The request of LocateShare.
message ShareLocationRequest {
    // The id of a network share, as the formal of the setting that declares the share
    // defines it.
    string share_id = 1;
}

// The answer of LocateShare.
message ShareLocation {
    // True if the node holds the network share now: it has the directory, and at
    // least one instance of the node uses it.
    bool held = 1;
}

// The answer of StopService.
message Refund {
    // The balance that the instance did not use, in MU. The node gives it back to the
    // caller that started the instance.
    Amount amount = 1;
}

// A payment on a ledger, which the payer tells to the node with Payable.
message Payment {
    // The deposit token from GenerateDepositToken. The payer writes it in the ledger
    // transaction, as the payment contract tells.
    string deposit_token = 1;
    // The payment contract that the payer paid into.
    Contract contract = 2;
    // The amount, in MU of the node that receives the payment.
    Amount amount = 3;
}

// The request of GetBalanceStatement. The caller asks for a range of movements by their
// seq, and nothing about the range changes what the node has already signed: a movement
// that a statement showed cannot change afterwards, because the hash of each one commits
// to all the ones before it.
message BalanceStatementRequest {
    // The instance token of a child of the caller, to read the account of that child.
    // Empty to read the account of the caller: its client_id, or the local instance
    // that calls, by its address.
    string token = 1;
    // The first movement asked for. 0 asks for no movement, only the head of the
    // account: the last movement and its hash.
    uint64 from_seq = 2;
    // The last movement asked for, included. 0 asks up to the head. The node never
    // returns more than its own limit in one answer.
    uint64 to_seq = 3;
    // The account of a descendant to read, by its instance_ref: the hash that the
    // movements of the account that links it carry (a child_bound). Absent to read the
    // account that token names. The node looks for it below the account that token
    // names (the caller's own account if token is empty), through the child_bound
    // movements, one level at a time. It answers PERMISSION_DENIED if the account is
    // not found there. The statement is of the descendant, and can be of an instance
    // that has stopped. The instance_ref of the account that token names is also
    // accepted: it reads that account, also when the instance stopped. A statement that
    // another node wrote comes with relayed set.
    Hash instance_ref = 4;
    // How many nodes the read can still go into, with the receiver. It is used only
    // with instance_ref. A node that asks one peer for a descendant sends one less. A
    // node that asks more peers shares one less between them, in equal parts. A
    // receiver that gets 0 refuses. A receiver that gets 1 answers from its own chains
    // and asks no peer. If it is absent, the receiver uses its own maximum
    // (network.RECURSION_MAX_HOPS). A value above that maximum becomes the maximum.
    optional uint32 remaining_hops = 5;
}

// One movement of a balance.
message BalanceMovement {
    // The number of the movement in its account. The first movement is 1, and each
    // movement adds 1, with no gap.
    uint64 seq = 1;
    // When the node wrote the movement, in unix seconds, on the clock of the node.
    uint64 ts = 2;
    // The change of the balance, in MU. A charge is negative.
    Amount amount = 3;
    // The balance after the movement, in MU.
    Amount balance_after = 4;
    // What the movement is: "deposit" (a payment on a ledger: of a client, or of the
    // instance for its own balance), "credit" (MU that nobody paid in),
    // "debit" (the operator took MU), "start" (the initial_mu that the instance got),
    // "build", "maintenance" (one period), "child_start" (the account paid the start of a child), "child_bound" (the
    // child of a child_start exists; moves nothing), "top_up", "withdrawal", "refund"
    // (MU that goes back to the parent), "tunnel", "resource_change", "stop" (the
    // account stops; its last movement; moves nothing) or
    // "statement_query". A reader treats a kind that it does not
    // know as a charge that it did not cause.
    string kind = 5;
    // The instance that the movement concerns, when it is not the account: the child of
    // a child_start, child_bound, top_up, withdrawal or refund. In a statement_query,
    // the account that was read. It is a hash of the token, never the token: the hash,
    // with the algorithm of its type, of "celaut-ledger-instance:" followed by the
    // token. A token is a credential, and a statement can be shown to others.
    Hash instance_ref = 6;
    // The cause of the movement, as JSON with sorted keys and no spaces. Empty if there
    // is none. For a maintenance period: "seconds", and the resources that the node
    // priced, each with the id of its formal as the key. For a refund of a charge that
    // was not used: "refunds_seq", the seq of that charge. For a child_bound:
    // "starts_seq", the seq of the child_start whose child it names, "service_id", the
    // value of the content hash of the service of the child, and "service_id_type", the
    // type of that hash, both in lowercase hexadecimal (absent in old rows). For a
    // start: "execution_name", the value of the name that the receipts of the
    // instance carry, in lowercase hexadecimal, and "receipt", the id of its start
    // receipt (in BalanceStatement.receipts). For a tunnel: "open" or "bytes",
    // "execution_name", and "session", the
    // receipt stream of the tunnel when the caller asked for receipts. For a stop:
    // "reason", the death reason of the instance, and "leftover", the MU that the
    // refund took out of the account. A movement that a party asked for has "actor":
    // "operator" (the operator of the node), "client" or "instance". For a top_up or a withdrawal, the
    // actor is the father of the instance. A movement that hibernates or wakes an instance
    // has "action": "hibernate" or "wake". A wake also has "receipt", the id of the start
    // receipt of its new process. The id of a receipt is the hash of the bytes of its
    // Signed, as "<type>:<value>", both in lowercase hexadecimal. A movement with no "actor" is one that the node wrote
    // by its own rule.
    string detail = 7;
    // The hash of the movement before this one. For the first movement, the genesis
    // hash of the account: the hash, with the algorithm of its type, of
    // "celaut-balance-genesis:" followed by the lowercase hexadecimal of the value of
    // account_ref. The hash of a movement is the hash, with the algorithm that
    // prev_hash.type names, of "celaut-balance-movement:" prev_hash "|" seq "~" ts "~"
    // hex(amount) "~" hex(balance_after) "~" hex(kind) "~" instance_ref "~"
    // hex(detail). In this text, prev_hash and instance_ref are the lowercase
    // hexadecimal of their values (an absent instance_ref is empty), the amounts are
    // decimal integers, and hex() is the lowercase hexadecimal of the UTF-8. All the
    // hashes of one account have the type of BalanceStatement.account_ref.
    Hash prev_hash = 8;
}

// The answer of GetBalanceStatement. The node signs it (Signed). A statement that is not
// in a Signed with a valid signature is not valid.
message BalanceStatement {
    // When the node answered, in unix seconds, on the clock of the node.
    uint64 ts = 1;
    // True when the node that signs did not write the movements. It read the statement
    // of a descendant from the next node, checked the signature of that node, and
    // signs it again for its own caller.
    bool relayed = 2;

    // Which account.
    // The account, as a hash: the hash, with the algorithm of its type, of
    // "celaut-ledger-account:" followed by the client_id or the instance token. Never
    // the credential itself, so that a statement can be shown to others.
    Hash account_ref = 3;
    // In the answer to a read with instance_ref: the service of the instance that the
    // statement is about, as its content hash. The caller can then know which service
    // each descendant runs. Absent when the node does not know it, and in the answer to
    // a read without instance_ref.
    Hash service_id = 4;
    // In the answer to a read with instance_ref: the instance_ref of the request. The
    // node signs that the statement is the account of that descendant, so it cannot say
    // later that the statement was of another account. A reader refuses an answer to a
    // read with instance_ref that does not have the same instance_ref. A node that
    // relays sets the instance_ref that its own caller asked for. Absent in the answer
    // to a read without instance_ref.
    Hash instance_ref = 5;

    // The range that the request asked for.
    // The first movement that the request asked for. 0 means none given.
    uint64 from_seq = 6;
    // The last movement that the request asked for. 0 means none given.
    uint64 to_seq = 7;
    // The movements of the range, in ascending seq order and with no gap. When the
    // caller reads its own account up to the head, the last movement is the charge for
    // this answer. If the node holds fewer movements than the range, because of its
    // retention or its limit, they are the first it holds from from_seq: the caller asks
    // again from the last seq it received.
    repeated BalanceMovement movements = 8;

    // The state of the account.
    // The balance of the account at the head, in MU.
    Amount balance = 9;
    // The last movement of the account when the node answered. The balance is the
    // balance after that movement. 0 for an account with no movement.
    uint64 head_seq = 10;
    // The hash of the last movement. For an account with no movement, its genesis hash.
    Hash head_hash = 11;
    // The first movement that the node still holds. Older ones were deleted when they
    // passed its retention, and the first movement it holds hangs from the hash of a
    // movement that it no longer has.
    uint64 oldest_seq = 12;
    // How long the node keeps the movements of a dead account, in days, after its last
    // movement. 0 means for ever, which is the default: the movements of an account that
    // lives, and of a dead account with anything alive below it, are never deleted. A
    // reader treats 0 as at least ledger.MIN_PEER_RETENTION_DAYS.
    uint32 retention_days = 13;
    // The start receipts of the processes whose movements are in this statement: the
    // start of the instance and each wake, as the node signed them (a Signed
    // StartReceipt). The movement of each start and each wake names
    // its receipt in its detail. It is the way to get the receipt of a process that no
    // caller asked for, for example a wake by a deposit or by the activity window of the
    // node. Empty if no process started in the movements of this statement.
    repeated Signed receipts = 14;
}

// The execution receipts (docs/EXECUTION_RECEIPTS.md) are statements that a node signs
// (Signed) about one execution that it runs. They give a client evidence against the
// node. They are never evidence for the node. The celaut-gateway layer gives how to
// calculate each hash. There are two receipts: StartReceipt for each process, and
// TunnelCheckpoint for each part of a ServiceTunnel stream. An optional protocol can
// define its own checkpoint (for example protos/extensions/observe.proto).
//
// The name of an execution is in each receipt: the hash, with the algorithm of its type,
// of the UTF-8 bytes of the instance token followed by the bytes of the signer
// (Signed.Body.signer). The client, who has the token, can calculate it. A receipt never
// contains the token. In a tunnel to a descendant, the name is the hash, with the
// algorithm of its type, of the UTF-8 bytes of "celaut-execution-ref:" and the lowercase
// hexadecimal of the value of the instance_ref, followed by the bytes of the signer: the
// caller has the instance_ref and not the token.

// What a node attests about a new process of an instance. The node signs one for each
// process: the answer of StartService gives the first one. Each wake of the instance has
// one more, with the same envs_salt as the first one, so that its envs_digest can be
// compared. BalanceStatement.receipts gives all of them.
message StartReceipt {
    // When the node signed, in unix seconds, on the clock of the node.
    uint64 ts = 1;
    // The name of the execution.
    Hash execution_name = 2;
    // The service of the instance, as the content hash with which the registry of the
    // node keeps it.
    Hash service_id = 3;
    // The hash, with the algorithm of its type, of the salt of the start
    // (ServiceInstance.envs_salt) followed by the UTF-8 of the canonical text of the
    // environment variables that the service got. The celaut-gateway layer gives the
    // canonical text.
    Hash envs_digest = 4;
    // The Configuration.initial_mu of the start, in MU: what the node charged the caller,
    // the build included. It is the amount of the "start" movement of the instance in its
    // balance statement. 0 for a wake.
    Amount initial_mu = 5;
    // What the node reserved for the process: the resolved figures, with the floors of
    // the node applied, and not what the manifest declared. They are what the maintenance
    // charge prices. A list of Quantity, with only formals of resources. Empty in a start
    // that the node gave to a peer: the executor reserved them and this node does not
    // attest them.
    repeated Quantity reserved = 6;
    // Other facts of the start that the node attests: a list of Policy in an
    // announcement. For example: the guest kernel that the instance boots, and the model
    // of each device that the node attached. A reader keeps a fact that it does not know.
    repeated Policy facts = 7;
}

// The events of one direction of a stream, up to a checkpoint.
message EventChain {
    // The number of events.
    uint64 events = 1;
    // The bytes of these events.
    uint64 bytes = 2;
    // The hash chain of these events, with the algorithm of its type. The layer of the
    // stream gives how to calculate it.
    Hash head = 3;
}

// What a node attests about a ServiceTunnel stream, up to a point. The node sends one
// from time to time when the TunnelRequest asks for receipts. The chains cover all the
// messages of the tunnel that the meter accepted, and nothing else.
message TunnelCheckpoint {
    // When the node signed, in unix seconds, on the clock of the node.
    uint64 ts = 1;
    // The name of the execution.
    Hash execution_name = 2;
    // A random identifier of the stream, that the node selects when the stream starts.
    bytes session = 3;
    // The internal port of the slot of the tunnel.
    uint32 slot = 4;
    // The number of the checkpoint in the stream: 1 for the first, and one more for each
    // next checkpoint.
    uint64 seq = 5;
    // True for the last checkpoint of the stream. The node sends it when the stream stops
    // normally. A caller that cancels the stream gets no last checkpoint, so a stream
    // with no last checkpoint is not by itself proof of a fault.
    bool close = 6;
    // The messages from the caller that the node sent to the service.
    EventChain into_instance = 7;
    // The messages from the service that the node sent to the caller.
    EventChain from_instance = 8;
    // What the node charged the instance for this tunnel up to the checkpoint, in MU: the
    // charge to open it and the traffic it billed. It is the sum of the "tunnel"
    // movements of this session in the balance statement.
    Amount mu_charged = 9;
}

// Signed messages of one node that show a fault of that node. A receiver checks them
// with the public key of that node only, and does not trust the node that sends them.
message FaultEvidence {
    // The reason of the fault, as the reasons of the reputation events.
    string reason = 1;
    // The peer_id of the node that the evidence accuses. That node signed each message
    // of the evidence.
    string accused = 2;
    // Messages that the accused node signed, each as that node sent it: pages of balance
    // statements in the order of their seqs, execution receipts, offers. The definition
    // of each reason gives which messages it needs. A receiver reads the type of each
    // message in its Signed.Body.context.
    repeated Signed evidence = 3;
}

// One opinion of a ReputationProof. It has the same parts as an opinion box of a
// reputation proof on a ledger.
message ReputationOpinion {
    // What kind of object the opinion is about, as R4 on the ledger. A node is the
    // CELAUT_NODE_TYPE_NFT_ID that the celaut-gateway layer gives. The opinions are an
    // announcement: a reader uses only the types that it knows, and keeps the others.
    // For example, the types of a registry of objectives (objective, coverage,
    // benchmark, result) are for the clients, and a node does not need to know them.
    string type = 1;
    // The object of the opinion, as R5 on the ledger. For a node, its peer_id.
    string object = 2;
    // How much of its opinion the publisher puts on the object, on the scale of the
    // reputation of the publisher. A fault report has 0: the score of the same object
    // already counts the fault.
    uint64 amount = 3;
    // True for an opinion for the object, false for an opinion against it, as R8 on
    // the ledger.
    bool positive = 4;
    // Free content, as R9 on the ledger. For a fault report, UTF-8 JSON with the key
    // "reason".
    bytes content = 5;
    // Only in a fault report: the signed messages that prove the fault. Absent when
    // the fault rests on what only the publisher knows.
    FaultEvidence evidence = 6;
}

// The opinions of a node, signed with its identity key (Signed). The signer is the
// publisher, and its peer_id is the id of the proof. It is the off-chain form of a
// reputation proof on a ledger, and it holds the pointers to the proofs of the node on
// ledgers (ledger_proofs). A receiver keeps only the newest proof of each publisher.
message ReputationProof {
    // When the publisher signed, in unix seconds. A receiver refuses a proof that is
    // not newer than the last proof that it accepted from the same publisher.
    uint64 ts = 1;
    // The nonce of the proof of work. The work of the proof is the number of leading
    // zero bits of a hash of the signed bytes. The celaut-gateway layer gives the hash.
    // The publisher tries nonces until the hash has the zero bits that it wants. The
    // signature covers the nonce, so a node that passes the proof on cannot change it.
    uint64 pow_nonce = 2;

    // The opinions.
    repeated ReputationOpinion opinions = 3;
    // The proofs of the publisher on ledgers, as pointers: each Contract names the ledger,
    // the script and the token of one proof, and carries the owner attestation (in its
    // xattrs) by which the wallet that owns the proof vouches for the publisher. They are
    // pointers: the opinions of such a proof are on the ledger, not here. A reader
    // credits a pointer only when the attestation verifies for the publisher. The list
    // is empty when the publisher has no proof on a ledger.
    repeated Contract ledger_proofs = 4;
}

// The answer of StartService.
message ServiceInstance {
    // The instance token. It is the credential for StopService, ModifyDeposit,
    // GetMetrics, ServiceTunnel and the optional protocol celaut-observe.
    string token = 1;
    // The addresses of the instance.
    Instance instance = 2;
    // 16 random bytes that the node selects for each start: the salt of
    // StartReceipt.envs_digest. No signature covers it: the holder of the receipt
    // can show the digest to others and keep the values secret. A verifier refuses a
    // salt of another length.
    bytes envs_salt = 3;
    // The start receipt of the instance: a Signed StartReceipt of the node that
    // answers. When the node gave the start to a peer, it signs the receipt as the
    // executor, with the token that the caller got.
    Signed receipt = 4;
}

// The identity (issue #236) is a keypair of the node's own, on no ledger. It is
// deliberately not a wallet: a wallet key is bound to what its ledger can verify and
// spend, so an identity that *was* one could never be anything else. The link to a
// ledger is an owner attestation on each reputation proof (Contract.xattrs), which
// costs one signature and buys the node the right to change, add or drop a wallet
// without changing its name.
//
// One scheme per Peer, and therefore one public_key: a second key is a second identity
// -- it splits the node's reputation, its deposits and its payment attribution in two,
// and the split cannot be healed by cross-signing the keys because whoever needs the
// link speaks only one of the two schemes. A key in a *different role* (a proof's
// owner, the per-process TLS key) is not a second identity: it is a hierarchy with a
// single root. A scheme that needs two keypairs (a classical/post-quantum hybrid) is
// ONE scheme with one descriptor whose encoding carries both. payment_contracts stays
// repeated on purpose: a menu the payer picks one item from.

// A message that a party signed, as the exact bytes that it signed. One form is for
// every signed message of this contract: a Peer, an offer, a balance statement, an
// execution receipt, a reputation proof, the binding of a client to a peer.
message Signed {
    // What the party signed.
    message Body {
        // The schema of the content. Its formal is the schema of the contract for the
        // type of the content and for the messages that it contains. Its tags give the
        // full name of the type, for example "celaut.Peer". It keeps a signature for one
        // use from another use, and the signature covers what the content means. A
        // reader refuses a context that is not the type that the place needs. It reads
        // the content only if it knows the formal, or if it reads the formal and decides
        // that the two schemas agree. The formal is not empty.
        Descriptor context = 1;
        // The public key of the signer, as the bytes that the scheme defines. This
        // contract gives it no length and no encoding. Its lowercase hexadecimal is the
        // id of the signer: for a node, its peer_id. A scheme with very large keys can
        // define its public key as a digest of the full key, and put the full key in
        // each signature. That is a decision of the scheme, not of this contract.
        bytes signer = 2;
        // The signature scheme: the cryptography of signer and of signature. Nodes
        // compare it by the exact bytes of its formal. A scheme with more than one key
        // or algorithm is one scheme with one formal. A reader refuses a scheme with an
        // empty formal.
        Descriptor scheme = 3;
        // The serialized message of the type that context gives.
        bytes content = 4;
    }
    // A serialized Body: the exact bytes that the signer signed. A reader verifies the
    // signature on these bytes as they came, and never on a second serialization of
    // them. So the signature also covers a field that the reader does not know. A node
    // that passes the message on sends these bytes with no change.
    bytes body = 1;
    // The signature of body, as the bytes that the scheme defines. A reader that cannot
    // verify the scheme, by itself or with a service that it trusts for that scheme,
    // reads the message as not signed. A message with an empty signature is not signed.
    bytes signature = 2;
}

// What a node announces about itself: its addresses, its prices and its resources. The
// node signs it (Signed): the signer is the identity of the node. A reader refuses a
// Peer that is not in a Signed with a signature that verifies. Each list of a Peer is an
// announcement: a reader keeps an entry that it does not know, and does not use it.
message Peer {
    // The unix time of the announcement, in seconds. A reader accepts a Peer only if its
    // ts is more than the ts of the last Peer that it accepted from the same signer.
    uint64 ts = 1;

    // Where the node is.
    // All the addresses of the node.
    repeated Uri uri = 2;

    // What the node charges, and what it limits.
    // The payment contracts that the node accepts, and the value of each in MU. They are
    // the same for all the addresses.
    repeated ContractRate payment_contracts = 3;
    // The rates of the node: what it charges for each resource and for each action.
    // Each rate is a base price. A condition or a promise of the node can say how the
    // price changes.
    repeated Rate rates = 4;
    // The limits of the node. They are for one client (the caller that pays for the
    // instance), or as their formal says.
    repeated Limit limits = 5;

    // What the node can run.
    // The maximum resources that the node supports, one entry for each architecture
    // that it runs. If the list is not empty, the node does not run an architecture
    // that is not in it. If the list is empty, the node gives no data about its
    // resources. Each value is a limit of capacity, not the free capacity now. The node
    // can refuse a request that fits, because of load. The node always refuses a
    // request that does not fit. Before a caller asks for a cost or for availability,
    // it can skip a node whose entry does not fit the request.
    repeated ArchitectureResources resources = 6;
    // The devices that the node can give to an instance (see Device). One entry is one
    // device as the guest sees it, as the node is configured now: a physical device or
    // a part of one. The node repeats an entry for each device that it has, so this
    // list can have two entries with the same architecture. The order of the list has
    // no meaning. The values are a limit of capacity, not the free capacity now.
    // GetResourceAvailability gives the real answer. This list is not Peer.resources:
    // a reader does not read a device architecture as a main architecture.
    repeated ArchitectureResources devices = 7;

    // How the node behaves. The two lists have the meaning of the lists of
    // EstimatedCost, but here they are announcements: they say what the node does now.
    // The lists of the offer are the authority for one instance.
    // The conditions of the node: a list of Policy in an announcement. For example: the
    // hours in which it takes new work, or how its price changes when a resource is
    // scarce.
    repeated Policy conditions = 8;
    // The promises of the node: a list of Policy in an announcement. For example: the
    // maximum scarcity multiplier, or a notice period before a stop.
    repeated Policy promises = 9;
}

// The proof of work fields come from issue #361; the peer binding from the "Peers and
// clients" section of docs/CONCEPTS.md.

// A client of the node: the identity of a caller. The node gives balance and limits
// calls for each client. To bind a client to a peer, the caller also sends a Signed
// Client that has only the client_id, signed by the identity key of that peer.
message Client {
    // The identifier of the client: 32 lowercase hexadecimal characters.
    string client_id = 1;
    // The challenge of a PoWRequired, without a change. Only in the GenerateClient
    // request that answers a PoWRequired.
    optional string challenge = 2;
    // The solution of the proof of work. Only with challenge.
    optional string pow_solution = 3;
}

// The answer of GenerateClient when the node needs a proof of work before it gives a
// new client.
message PoWRequired {
    // The proof of work. Its formal is the rule of the work, as a text that a program
    // can read.
    Descriptor descriptor = 1;
    // The challenge. Send it back without a change, with the solution.
    string challenge = 2;
    // The difficulty of the work, as a number in the unit that the formal defines. It is
    // a copy for the caller: the node uses the difficulty in the challenge.
    uint32 difficulty = 3;
}


// See docs/RECURSION_GUARD.md (issue #456).

// The guard of a StartService request that a node can forward to its peers. It stops a
// request that comes back to a node, and it limits the depth of the tree. The node
// ignores the guard of a request from one of its local instances. That request starts
// a new tree.
message RecursionGuard {
    // The name of the whole tree of requests. A node forwards it without a change.
    // While a node answers a request with this token, it refuses each other request
    // with the same token. If the token is empty, the node starts a new tree with a new
    // token. The node refuses a token that is longer than 128 characters, or that has
    // characters other than A-Z, a-z, 0-9, ".", "_", ":" and "-".
    string token = 1;
    // How many nodes the tree can still go into, with the receiver. Each forward sends
    // one less. A receiver that gets 0 refuses. If it is absent, the receiver uses its
    // own maximum. A value more than the maximum of the receiver becomes that maximum.
    // A receiver that gets 1 can do the work, but it does not forward the request.
    optional uint32 remaining_hops = 2;
}

// The reference of a StartService request, chosen by the caller (#578). With it, the
// request is idempotent: a caller that lost the answer asks again with the same
// reference and learns what the node did.
//
// The node keys the reference by the caller: its client_id, or the local instance that
// asks. The same reference from another caller is another start. A second request with
// the same reference and caller does not start anything and charges nothing:
//   * after the first start succeeded, the node returns the same ServiceInstance;
//   * while the first start runs, the node refuses with ABORTED, and the caller asks
//     again later;
//   * after the first start failed, the node refuses with FAILED_PRECONDITION and the
//     error of that start.
// A request that the node answers from its reference needs no service: a Client and a
// StartReference are enough. The StartReference must come before the hashes of the
// service: the node can begin the start at the first one, and a reference that comes
// after that is ignored.
//
// A start with a reference whose call ends before the answer keeps its instance: the
// caller can ask for it again. With no reference, the node stops that instance.
//
// The node keeps a reference while its instance lives, and at least
// ledger.RETENTION_DAYS after the start ended. The child_start movement that pays the
// start carries the reference, in hex, in detail.start_ref. A caller can then tell
// which request caused each start that it paid for.
message StartReference {
    // From 1 to 64 bytes. The node refuses a longer reference.
    bytes ref = 1;
}

// The answer of a request that a node accepts or refuses: IntroducePeer,
// AssociateClient, ModifyDeposit and PushReputationProof.
message Ack {
    // True if the node did what the request asked.
    bool accepted = 1;
    // Why the node refused. Empty if accepted is true. For a person: do not parse it.
    string reason = 2;
}

// A device that is attached to an instance now.
message AttachedDevice {
    // The identifier of the device for this instance. The node makes it when it
    // attaches the device. It stays the same until the node detaches the device. An id
    // is not valid for another instance.
    string id = 1;
    // The architecture, the resources and the facts of the device that the node gave.
    ArchitectureResources device = 2;
    // The address of the device in the guest, in the form that the architecture of the
    // device defines. The service finds the device with it.
    string guest_address = 3;
    // The position of the entry of Container.devices that this device fills.
    uint32 entry = 4;
}

// A change of the devices of an instance. The node never changes a device that the
// change does not name.
message DeviceChange {
    // A device to attach.
    message Attach {
        // The position of the entry in Container.devices. The instance must not have
        // a device for that entry now: the entry has a setting to attach the device on
        // request, or its device failed.
        uint32 entry = 1;
        // The resources that the instance asks for, as a list of Quantity with only
        // formals of resources of the device. A resource that is not in the list has
        // its value in at_init of the entry. Each value must not be more than at_most
        // of the entry.
        repeated Quantity resources = 2;
    }

    // A new value for the resources of a device that the instance has now.
    message Resize {
        // The id of the device (AttachedDevice.id). An unknown id is an error.
        string id = 1;
        // The resources that the instance asks for, as in Attach.resources. A resource
        // that is not in the list keeps the value of the device.
        repeated Quantity resources = 2;
    }

    // The devices to attach. One entry is one new device.
    repeated Attach attach = 1;
    // The ids (AttachedDevice.id) of the devices to detach. Only a device of an entry
    // with a setting to attach on request. The service must have released each device
    // in the guest before it asks. An unknown id is an error.
    repeated string detach = 2;
    // The devices to resize. Any device that the instance has, also one that the node
    // attached at the start. A node that cannot change a resource of a device refuses,
    // and its reason names the formal of that resource.
    repeated Resize resize = 3;
}

// The state of an instance now: the answer of GetMetrics and of
// ModifyServiceSystemResources.
message InstanceState {
    // The resources of the instance now, as a list of Quantity with only formals of
    // resources.
    repeated Quantity resources = 1;
    // The balance of the instance, in MU.
    Amount balance = 2;
    // The devices that the instance has now, also the ones that the node attached at
    // the start. Empty if the instance has none.
    repeated AttachedDevice devices = 3;
    // True if the instance is hibernated now: it has no process (see "The life of an
    // instance").
    bool hibernated = 4;
    // The addresses of the instance now. They can change when the node places the
    // instance again.
    Instance instance = 5;
}

// The request of ModifyServiceSystemResources. A node that cannot change a resource of a
// running instance refuses the request, and its reason names the formal of that
// resource.
message ModifyServiceSystemResourcesInput {
    // The resources that the instance asks for, as a list of Quantity with only
    // formals of resources. A resource that is not in the list keeps the value of the
    // instance. Each value must not be more than the at_most of the service. A request
    // has no benchmarks: a score is not a thing that an instance asks for. A value
    // never hibernates or wakes the instance: only the field hibernated does. For a
    // hibernated instance, the resources are the ones that it gets when it wakes.
    repeated Quantity resources = 1;
    // The instance token. Optional. If it is set, the node changes that instance, whoever
    // sends the request, and the instance that the token names pays for the call. If the
    // parent of the instance is a client, the request must also have that Client. If it
    // is not set, the node changes the local instance that sends the request, which it
    // finds by the address of the caller.
    string service_token = 2;
    // A change of the devices of the instance. If it is not set, the devices do not
    // change. A node that cannot do a part of the change refuses the request, and
    // never ignores a part. The change is only for an instance that runs: the node
    // refuses it for a hibernated instance, also in a request that wakes it. The new
    // process asks after the wake.
    DeviceChange devices = 3;
    // The state that the instance asks for. True: the node hibernates the instance.
    // False: the node wakes it. Absent: the state does not change. A request can set
    // the resources and the state together: the node applies the resources first. A
    // request that asks for the state that the instance has already is not an error.
    // A node that cannot hibernate the instance refuses, and gives the reason. See "The
    // life of an instance".
    optional bool hibernated = 4;
}

// The request of ModifyDeposit.
message ModifyDepositInput {
    // The change of the balance of the instance, in MU. A positive value moves balance
    // from the parent of the instance to the instance. The parent is the client or the
    // instance that started it. A negative value moves balance from the instance back
    // to the parent.
    Amount difference = 1;
    // The instance token.
    string service_token = 2;
}

// -----------------------
// GATEWAY SERVICE DEFINITION
// -----------------------

// The Gateway of a node. Each RPC is a stream of buffer.Buffer in each direction. The
// celaut-gateway layer of each address gives the message type at each bee-rpc index and
// the kind of authentication of each RPC:
//   * client: a Client in the request, at the index that the layer gives, in any
//     sequence. A local instance of the node is exempt. All these RPCs share one rate
//     limit for each client_id.
//   * token: a token in the payload (an instance token).
//   * token+client: an instance token in the payload, and a Client at the index that
//     the layer gives. The Client is necessary when the parent of the instance is a
//     client. Then the Client must be that parent. If the parent is another instance or
//     a node, the token is the only credential and the Client is not read. The Client
//     shares the rate limit of the client RPCs.
//   * local-address: ModifyServiceSystemResources, only for a local instance.
//   * none: GenerateClient, which can answer with a PoWRequired.
// A node refuses a request with a status code. A message that a node signs travels as a
// Signed.
service Gateway {
    // Starts a service. The caller sends a Client and the service as content hashes or
    // as the full Service. It can also send a Configuration and a
    // RecursionGuard, and a StartReference that makes the request idempotent. The node
    // returns a ServiceInstance with the addresses of the instance, its token and a
    // signed start receipt. The node can start the service on a peer and give the
    // addresses of that instance. If the node does not have the service and the caller
    // does not send it, the node refuses with an error. When the node refuses because it
    // does not know a formal, the error status carries the descriptor of each formal
    // that it does not know in its details. The celaut-gateway layer defines the exact
    // form.
    rpc StartService(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Stops an instance. The TokenMessage gives the instance token. If the parent of
    // the instance is a client, the request must also have that Client. The node gives
    // the balance that the instance did not use back to its parent, and returns a Refund
    // with that amount. If the node does not know the token, the Refund is 0.
    rpc StopService(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Changes the balance of an instance. The service_token gives the instance. The
    // parent of the instance pays or gets the difference. If the parent is a client, the
    // request must also have that Client, for a positive and for a negative difference.
    // The node returns an Ack.
    rpc ModifyDeposit(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Returns the Signed Peer of the node.
    rpc GetPeerInfo(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Returns a stream of Signed Peer. Each one is the advertisement of a third party
    // that this node knows. The node sends the advertisement as it is, never changed.
    // The number of Peers has a limit. If the node does not share its known peers, the
    // stream is empty.
    rpc ListPeers(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Returns a stream of Signed ReputationProof: first the proof of the node, then
    // proofs of other nodes that the node holds. The node sends each proof as its
    // publisher signed it, never changed. The number of proofs has a limit. If the node
    // does not share reputation proofs, the stream is empty.
    rpc GetReputationProofs(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Gives the node one Signed ReputationProof, in place of the node taking it with
    // GetReputationProofs. The node checks it in the same way. The node can refuse the
    // call before it reads the proof. The answer is an Ack. A node that does not accept
    // pushed proofs refuses every call.
    rpc PushReputationProof(stream buffer.Buffer) returns (stream buffer.Buffer) {}

    // Any Service.Network, not one kind of it. If the caller must know the kind first,
    // the caller does the resolution itself.

    // Takes a Service.Network and returns the addresses of the members of that network
    // that the node can find. The node does not ask other nodes. This is what the node
    // believes, not a proof: the caller must make sure that each address is correct.
    // The node refuses a network that it does not allow, and a network that it cannot
    // resolve. The request is a network as an instance uses it: the node refuses a
    // network with a setting that changes the value of its domain at a start. If the node
    // does not know the formal of the domain, the error gives it. For a local instance,
    // the request must agree with a network that its service declares, after the node
    // applies the settings of that network. The node then also lets that instance
    // connect to the addresses.
    rpc ResolveNetwork(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes a ShareLocationRequest with the id of a network share. Returns a
    // ShareLocation that tells if the node holds that share now. The node does not ask
    // other nodes. Only a network share is reported, never a share from a parent to its
    // children.
    rpc LocateShare(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Sends the Signed Peer of the caller, with a Client. The node returns an Ack:
    // accepted is true if the node knows the caller now.
    rpc IntroducePeer(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Returns a new Client. The caller can send a Client with a proposed client_id. It
    // can also send a Signed Client to bind the client to a peer. The node binds it only
    // if it already knows that peer. If not, use AssociateClient later. If the node
    // needs a proof of work, it returns a PoWRequired. Then the caller sends the Client
    // again, with the same client_id, the challenge and a solution.
    rpc GenerateClient(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Binds a client_id to the identity of the caller, after IntroducePeer stored the
    // caller as a peer. The caller sends a Signed Client. The node returns an Ack.
    rpc AssociateClient(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Returns a TokenMessage with a new deposit token for the client. The payer writes
    // this token in its ledger transaction. The payment contract gives where and how.
    // A local instance of the node can call it with an empty client_id: the token then
    // pays into the balance of the caller.
    rpc GenerateDepositToken(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Tells the node about a payment. The Payment gives the deposit token, the contract
    // and the amount. The node examines the ledger. Then it adds the amount to the
    // client that got that deposit token. The node accepts each deposit token one time.
    rpc Payable(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Changes the resources of an instance, and hibernates or wakes it (see
    // ModifyServiceSystemResourcesInput). A local instance of the node can call it for
    // itself: the node identifies it by its address. Anyone can call it for another
    // instance with its service_token (and the Client of its parent, if the parent is a
    // client). The node takes a fee from the balance of the instance that changes. It
    // returns the InstanceState.
    rpc ModifyServiceSystemResources(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes the same objects as StartService. Returns a Signed EstimatedCost: the offer
    // of this node to run the service. It starts nothing. A node that cannot run the
    // service now refuses with the reason. If the node does not have the service and
    // the caller does not send it, the node refuses with an error. When the node refuses
    // because it does not know a formal, the error status carries the descriptor of
    // each formal that it does not know in its details. The celaut-gateway layer defines
    // the exact form. The node ignores a RecursionGuard here.
    rpc GetServiceEstimatedCost(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes a Service.Container, complete or partial: the architecture, the resources,
    // the devices and the settings of one instance. Returns a ResourceAvailability that
    // tells if the node can run it now. The container does not need to be that of a
    // known service. The architecture is necessary, also in a partial container.
    rpc GetResourceAvailability(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes a content hash. Returns the hashes and the Service, at the StartService
    // indices, so the caller can send them to StartService without a
    // change.
    rpc GetService(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes an instance token. Returns the InstanceState.
    rpc GetMetrics(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes a Client. Returns the balance of the client, as an Amount. The node does not
    // charge for the answer. The balance of a client is not available with an instance
    // token.
    rpc GetClientMetrics(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Takes a BalanceStatementRequest and returns a Signed BalanceStatement: the
    // movements of the balance of the caller, or of a child of the caller, or, with
    // instance_ref, of a descendant of one of them. The caller pays for it, at the rates
    // of the node for a statement. The node writes the charge as a movement before it
    // answers. The node refuses with a status code: RESOURCE_EXHAUSTED when the caller
    // cannot pay for the answer, PERMISSION_DENIED when the account is not the caller's
    // or below it, NOT_FOUND when the account does not exist, and UNIMPLEMENTED for an
    // instance that this node delegated to another node.
    rpc GetBalanceStatement(stream buffer.Buffer) returns (stream buffer.Buffer) {}
    // Opens a byte stream to a declared slot of an instance. First, the caller sends a
    // TunnelRequest. Then each side sends raw bytes. For a slot with a stream transport,
    // when the stream of the caller stops, the node closes the write side of the
    // connection to the service. For a slot with a datagram transport, each message is
    // one datagram. The node takes the traffic cost from the balance of the instance. If
    // the request has receipts, the node also sends Signed TunnelCheckpoint messages,
    // and a last one when the stream stops normally. The node refuses
    // with a status code: PERMISSION_DENIED when no chain below the token links the
    // descendant, RESOURCE_EXHAUSTED when the instance cannot pay or the node has no
    // traffic allowance left, UNAVAILABLE when the instance does not answer or is not
    // alive, and INVALID_ARGUMENT for a request that is not correct. When a node below
    // refuses after the stream started, the stream stops with no more bytes. A caller
    // that has no token can send a Uri in place of the TunnelRequest: the address that
    // the node published for a slot. The node opens the stream only if a policy of the
    // slot allows it. In this mode there are no receipts, and every failure is
    // UNAVAILABLE, with one text.
    rpc ServiceTunnel(stream buffer.Buffer) returns (stream buffer.Buffer) {}
}
