syntax = "proto3";
package celaut.chat;

import "celaut.proto";

// An optional protocol of a node: a text chat between a client and the operator of the
// node. Two nodes work together without it, so it is not in celaut.proto (protos/
// REASON.md). It is a normal gRPC service, with no bee-rpc. A node that serves it
// announces it as one more branch of the gRPC layer of its address (see celaut.Layer),
// with its own formal: the layer celaut-chat. A node that does not serve it does not
// announce that branch.

// -----------------------
// HOW TO READ THIS FILE
// The comments follow the rules of the comments of celaut.proto. Each message here is
// read with the definitions of celaut.proto: a name that is not defined here (for
// example Signed, Client or Metadata) is the message of the package celaut.
// -----------------------

// Chat. A conversation is always opened by a client against a node, and it lives on
// that node. It has the name client_id#conversation_id, where client_id is the client_id
// that the node gave to the client and conversation_id is a number that the node gives:
// 1 for the first conversation of that client, then 2, 3, and so on. The number is never
// reused. The name is unique in the node, so both sides use it. The operator of a node
// that wants to talk to the operator of another node is a client of that node (the
// client_id that it holds there), the same as any other client. If the client is bound
// to a peer, the node groups its conversations with that peer; the conversations do not
// change when the binding is made.
//
// Each message of a client has a sequence in the node: 1, 2, 3, ..., over all the
// conversations of that client. It never changes and it grows by 1. A reader that has
// the messages up to one sequence asks for the ones after it with GetThread.

// A text message of a client to the operator of a node (Send).
message ChatMessage {
    // The client_id of the sender on the node that receives the message.
    string client_id = 1;
    // The conversation of the message. 0 opens a new conversation: the node gives it the
    // next number and returns it in ChatAck. Any other value is a conversation of this
    // client that the node already has.
    uint64 conversation_id = 2;
    // A label of the conversation, for a reader of the list of conversations. Optional.
    // The node keeps it only if conversation_id is 0.
    optional string topic = 3;
    // The text of the message.
    string body = 4;
    // The Metadata of a service that the sender shares. Optional. The body also names
    // the service, for a reader that does not know this field.
    optional Metadata service = 5;
}

// One message of a conversation, as the node keeps it. The node that keeps the
// conversation signs each entry that it stores (Signed): the entries of the client too,
// so the entry is a receipt that the node got the message, and the entries of the
// operator. An entry that is not in a Signed with a valid signature is not valid. The
// signature binds the node and nobody else: it does not prove that the client wrote the
// text.
message ChatEntry {
    // The position of the message in the messages of the client. The first message has
    // sequence 1. The node gives the sequence; it never changes and it grows by 1.
    uint64 sequence = 1;
    // The conversation of the message.
    uint64 conversation_id = 2;
    // The time that the node stored the message, in unix seconds.
    uint64 ts = 3;
    // True if the operator of the node wrote the message, false if the client did.
    bool from_operator = 4;
    // The text of the message.
    string body = 5;
    // The Metadata of a service that the writer shares. Optional.
    optional Metadata service = 6;
    // The hash of the entry before this one in the same conversation, with the
    // algorithm of its type. The first entry of a conversation has the hash that the
    // celaut-chat layer gives for the start of a conversation. The layer also gives
    // how to calculate the hash of an entry. So a node cannot remove or add a message
    // in the middle of a conversation without a break in the chain that a reader can
    // see. Its type is the type of client_ref.
    Metadata.HashTag.Hash prev_hash = 7;
    // The client of the conversation, as a hash: the hash, with the algorithm of its
    // type, of "celaut-chat-client:" followed by the client_id. Never the client_id
    // itself, so that a signed conversation can be shown to others.
    Metadata.HashTag.Hash client_ref = 8;
}

// The request of GetThread.
message ChatThreadRequest {
    // Send only the messages with a sequence more than this. 0 sends the messages from
    // the first one (up to the limit of the node).
    uint64 after_sequence = 1;
    // The client whose thread the caller asks for. The node gives only the thread of
    // this client.
    Client client = 2;
}

// The answer of GetThread.
message ChatThread {
    // The messages of all the conversations of the client, in order of sequence. Each
    // one is a Signed ChatEntry of the node.
    repeated Signed entries = 1;
    // The sequence of the last message of the client, also if entries is empty or the
    // node cut it. 0 if the client has no message. A reader compares it with the last
    // sequence that it has to know whether there is something new.
    uint64 latest = 2;
}

// The answer of Send.
message ChatAck {
    // True if the node stored the message.
    bool stored = 1;
    // Why the node did not store the message. Empty if stored is true.
    string reason = 2;
    // The message as the node stored it, as a Signed ChatEntry of the node: its
    // conversation (the number that the node gave if the message opened one), its
    // sequence and its time. The client keeps it as the receipt of the node. Not set if
    // stored is false.
    optional Signed entry = 3;
}

// The chat of a node. The client_id in the ChatMessage, or the Client in the
// ChatThreadRequest, identifies the client. The node refuses a request with a status
// code.
service Chat {
    // Sends a ChatMessage to the operator of the node, in a conversation of the client
    // (conversation_id 0 opens one). The node returns a ChatAck. The client_id is
    // enough; a binding to a peer is optional.
    rpc Send(ChatMessage) returns (ChatAck) {}
    // Returns the ChatThread of the client of the request: the messages that it sent
    // and the answers of the operator, in all its conversations. It is free.
    rpc GetThread(ChatThreadRequest) returns (ChatThread) {}
}
